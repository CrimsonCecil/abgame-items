vice-width,initial-scale=1"><title>ABGame 物品&背包系统 Demo V1.8</title><style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0f16;color:#e8eef2;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;height:100%}
#stageWrap{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:10px;background:#3f4658}
#cv{position:absolute;left:0;top:0}
.hud{position:absolute;inset:0;pointer-events:none}
.p{pointer-events:auto}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;line-height:1}

/* 顶部 */
.task{position:absolute;left:22px;top:14px;height:44px;padding:0 16px 0 12px;display:flex;align-items:center;gap:10px;background:#16282bd9;border:2px solid #3d6a66;border-radius:12px;font-size:20px;font-weight:700;color:#e9f4f1}
.task i{width:24px;height:24px;border-radius:50%;background:#e9f4f1;color:#16282b;font-style:normal;font-weight:900;display:grid;place-items:center;font-size:16px}
.task em{font-style:normal;color:#9cc;font-size:14px;margin-left:8px}
.timer{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:230px;height:62px;background:#141c24d9;border-radius:10px;text-align:center;border:1px solid #ffffff14}
.timer small{display:block;font-size:13px;color:#cfd8dc;margin-top:6px}
.timer b{display:block;font-size:28px;font-weight:700;color:#fff;letter-spacing:1px;line-height:30px}
.mini{position:absolute;right:16px;top:10px;width:118px;height:118px;border-radius:50%;background:radial-gradient(#3c4a50cc,#1f2a30cc);border:2px solid #ffffff22;overflow:hidden}
.mini i{position:absolute;left:50%;top:50%;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid #fff;transform:translate(-50%,-60%) rotate(var(--a,0deg))}
.gear{position:absolute;right:146px;top:20px;width:34px;height:34px;color:#e3e7ea;font-size:30px;line-height:34px;text-align:center}

/* 底部栏 */
#avatar{display:none;position:absolute;left:356px;top:600px;width:66px;height:66px;border-radius:50%;background:radial-gradient(#ffe7d6,#f5b48e);border:3px solid #fff;display:grid;place-items:center;font-size:40px;box-shadow:0 2px 6px #0007}
#slots{position:absolute;left:380px;top:596px;height:72px;display:flex;gap:4px;align-items:flex-end}
.slot{position:relative;width:76px;height:76px;border-radius:8px;background:#1b2a30cc;border:2px solid #ffffff1c;display:grid;place-items:center;font-size:42px;cursor:pointer;overflow:hidden;touch-action:none}
.slot.gap{margin-left:16px}
.slot{width:72px;height:72px}
.slot.side{border-radius:50%;width:70px;height:70px;align-self:center;font-size:36px}
.slot.side .n{right:0;left:0;bottom:4px;text-align:center;font-size:12px}
.slot.side .cdm{border-radius:50%}
.slot.side .qb{left:22px;right:22px;top:4px;border-radius:2px}
.slot.wide{width:148px;font-size:40px;border-radius:6px}
.slot.wide>.emo,.slot.wide>.pb{transform:translateY(-6px)}
.slot.wide .wn{position:absolute;right:8px;top:6px;font-size:11px;color:#ffffffaa;font-weight:700}
.slot.wide .qb{height:3px}
.slot.wide.sel .qb{height:5px;box-shadow:0 0 8px currentColor}
.slot.wide .dbar{left:10px;right:10px;bottom:8px}
.slot.ball{width:52px;border-radius:6px}
.slot.ball .n{right:4px;bottom:2px;font-size:12px}
.slot.sel{border-color:#9be8d2;background:#24443ecc;box-shadow:0 0 0 2px #9be8d255 inset}
.slot.sel::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:#9be8d2}
.slot .ph{opacity:.22;filter:grayscale(1);font-size:34px}
.slot .n{position:absolute;right:5px;bottom:3px;font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.slot .k{position:absolute;left:5px;top:2px;font-size:11px;color:#ffffff88;font-weight:700}
.slot .qb{position:absolute;left:0;right:0;top:0;height:4px}
.slot .dbar,.cell .dbar,.wit .dbar,.dtl .dbar{position:absolute;left:7px;right:7px;bottom:6px;height:5px;border-radius:3px;background:#000a;overflow:hidden}
.dbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#7cf29c}
.dbar i.low{background:#ff5a4e}
.slot .cdm{position:absolute;inset:0;border-radius:6px}
.slot .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
.slot.zero>.emo,.slot.zero>.pb{opacity:.35}
.slot.rec{animation:rec 1s infinite}
@keyframes rec{50%{box-shadow:0 0 0 4px #7cf29c88}}
.slot.flash{animation:fl .5s 2}
@keyframes fl{50%{border-color:#ffd166;background:#5a4a1ecc}}

#bagBtn{position:absolute;left:22px;top:648px;width:56px;height:56px;border-radius:12px;background:#1b2a30cc;border:2px solid #ffffff22;display:grid;place-items:center;font-size:30px;cursor:pointer}
#hpWrap{position:absolute;left:434px;top:676px;width:412px}
#hpWrap .hp{position:relative;height:16px;border-radius:8px;background:#0008;overflow:hidden}
#hpBar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff5d5d,#d93434);border-radius:8px}
#hpTxt{position:absolute;inset:0;text-align:center;font-size:12px;line-height:16px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
#hpWrap .st{position:relative;height:7px;margin:4px 40px 0;border-radius:4px;background:#0008;overflow:hidden}
#stBar{position:absolute;left:0;top:0;bottom:0;background:#4aa8e8;border-radius:4px}

/* 右侧按键 */
.abtn{position:absolute;width:72px;height:72px;border-radius:50%;background:#3d7f78cc;border:4px solid #f2f6f5;display:grid;place-items:center;font-size:34px;cursor:pointer;touch-action:none;box-shadow:0 2px 8px #0006}
.abtn.press,.slot.press{transform:scale(.92)}
.abtn .cdm{position:absolute;inset:-4px;border-radius:50%}
.abtn .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.abtn.on{background:#e0a33ecc}
#bMain{width:124px;height:124px;background:#c9d2d633;border:3px solid #ffffff55;font-size:56px}
#bMain .ring{position:absolute;inset:-7px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 63px,#000 64px);mask:radial-gradient(circle,transparent 63px,#000 64px)}
#bRun{left:1018px;top:612px}#bJump{left:1030px;top:500px}#bDash{left:1128px;top:432px}#bMain{left:1124px;top:560px}
#joy{position:absolute;left:96px;top:470px;width:150px;height:150px;border-radius:50%;background:#ffffff10}
#knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:#d9dde0aa}
#bSearch{position:absolute;left:50%;top:520px;transform:translateX(-50%);display:none;padding:8px 20px;border-radius:22px;background:#e9f4f1;color:#15302c;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 2px 8px #0008}
#bSearch.on{display:block}
#hint{position:absolute;left:380px;top:540px;display:none;padding:6px 12px;border-radius:10px;background:#fff;color:#15302c;font-size:14px;font-weight:700;white-space:nowrap}
#hint::after{content:"";position:absolute;left:84px;bottom:-12px;border:6px solid transparent;border-top-color:#fff}
#hint.on{display:block}
#prog{position:absolute;left:50%;top:548px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:4px 10px;border-radius:16px;background:#0b1418dd;font-size:14px}
#prog.on{display:flex}
#prog .pb{width:120px;height:6px;border-radius:3px;background:#ffffff22;position:relative;overflow:hidden}
#prog .pb i{position:absolute;left:0;top:0;bottom:0;background:#7cf29c}
#prog .x{cursor:pointer;color:#ff9a8a;font-weight:900}

/* 轮盘 */
#wheel{position:absolute;left:640px;top:330px;width:0;height:0;display:none}
#wheel.on{display:block}
#wheel .ring{position:absolute;left:-170px;top:-170px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#0c1418ee 0 30%,#14242aee 31% 100%);border:2px solid #9be8d244;box-shadow:0 0 30px #000a}
#wSect{position:absolute;left:-170px;top:-170px;width:340px;height:340px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 30%,#000 31%);mask:radial-gradient(circle,transparent 30%,#000 31%)}
.wit{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:12px;display:grid;place-items:center;font-size:36px;border:2px solid #ffffff22;background:#1b2a30}
.wit.on{transform:scale(1.15);border-color:#ffd166}
.wit.cur{box-shadow:0 0 0 2px #9be8d2}
.wit.zero{opacity:.35}
.wit .n{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
.wit .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800;background:#0008;border-radius:10px}
#wCtr{position:absolute;left:-52px;top:-52px;width:104px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;text-align:center;gap:4px}
#wCtr .dbar{display:block;height:6px;position:relative;left:auto;right:auto;bottom:auto;width:70px}

/* 提示 */
#toasts{z-index:300;pointer-events:none;position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}

<script>const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const W=1280,H=720,LONG=260,WCX=640,WCY=330,DEAD=10;
const CFG_DEF={bagW:5,bagH:12,wSlots:2,wheelN:6,safeLv:3,stack:5,runDrain:12,runMul:1.5,dashSt:1,dashCost:20,wheelUseCons:0,wheelUseLoot:0,autoSort:0};
const CKEY='abg_item_cfg_r1';
let CFG=Object.assign({},CFG_DEF);try{Object.assign(CFG,JSON.parse(localStorage.getItem(CKEY)||'{}'))}catch(e){}
const SAFE_LV=[1,2,3,4,5];

/* ---------- 品质 ---------- */
const QN=['','白','绿','蓝','紫','金','红'];
const QC=['#666','#a9aeb5','#3cc46e','#3d8ff0','#a66bf0','#f2b630','#f25550'];
const QV=[0,1,1.6,2.5,4,6.5,10];          // 价值倍率
const QM=[0,1,1.12,1.25,1.4,1.6,1.85];    // 武器伤害 / 耐久、药品效果、功能强度倍率
const QB=[0,.2,.3,.42,.56,.72,.9];        // 精灵球收服率
const QS=[0,1,1.3,1.6,2,2.5,3];           // 定身 / 冰冻 / 致盲 秒数
const QW=[0,30,28,20,12,7,3];             // 掉落权重
const rollQ=()=>{let r=Math.random()*100;for(let q=1;q<=6;q++){r-=QW[q];if(r<=0)return q}return 1};

/* ---------- 物品定义 ---------- */
const DEF={
 fist:{n:'拳头',ic:'👊',cat:'weapon',dmg:8,rng:62,cd:.35,kb:60,val:0,sz:[1,1]},
 brick:{n:'板砖',ic:'🧱',cat:'weapon',dmg:16,rng:72,cd:.7,kb:40,dur:8,val:200,sz:[1,1]},
 knife:{n:'菜刀',ic:'🔪',cat:'weapon',dmg:20,rng:84,cd:.45,kb:18,dur:14,val:500,sz:[1,2]},
 bat:{n:'球棒',ic:'🏏',cat:'weapon',dmg:24,rng:92,cd:.6,kb:50,dur:16,val:700,sz:[1,2]},
 pan:{n:'平底锅',ic:'🍳',cat:'weapon',dmg:28,rng:80,cd:.65,kb:46,dur:18,val:900,sz:[2,2]},
 croc:{n:'鳄鱼枪',ic:'🐊',cat:'weapon',dmg:16,rng:420,cd:.5,kb:14,dur:18,val:1000,ranged:1,pc:'#9be36b',sz:[2,1]},
 bubble:{n:'泡泡枪',ic:'🔫',cat:'weapon',dmg:13,rng:360,cd:.38,kb:10,dur:24,val:1000,ranged:1,pc:'#bfe8ff',sz:[2,2]},
 potionS:{n:'血瓶(小)',ic:'🧪',cat:'med',heal:25,t:1,val:150,sz:[1,1]},
 energy:{n:'能量饮料',ic:'🥤',cat:'med',sta:100,t:.8,val:250,sz:[1,1]},
 candy:{n:'加速糖',ic:'🍬',cat:'med',spd:4,t:.5,val:180,sz:[1,1]},
 bCatch:{n:'精灵球',ball:'catch',bt:'#e8463f',cat:'ball',val:300,sz:[1,1]},
 bIce:{n:'冰冻球',ball:'ice',bt:'#56c8f0',cat:'ball',val:260,sz:[1,1]},
 bFlash:{n:'闪光球',ball:'flash',bt:'#f6cf3a',cat:'ball',val:220,sz:[1,1]},
 book:{n:'习题册',ic:'📕',cat:'loot',val:200,sz:[1,2]},
 duck:{n:'小黄鸭',ic:'🦆',cat:'loot',val:300,sz:[1,1]},
 camera:{n:'拍立得',ic:'📷',cat:'loot',val:900,sz:[2,1]},
 trophy:{n:'奖杯',ic:'🏆',cat:'loot',val:1500,sz:[2,2]},
 watch:{n:'怀表',ic:'⌚',cat:'loot',val:1200,sz:[1,1]},
 gem:{n:'钻石',ic:'💎',cat:'loot',val:2500,sz:[1,1]},
 capBear:{n:'抱抱熊',ic:'🧸',cat:'loot',val:1200,sz:[1,1]},
 capWorm:{n:'猫猫虫',ic:'🐛',cat:'loot',val:1000,sz:[1,1]},
 popper:{n:'摔炮',ic:'🧨',cat:'loot',fn:'stun',cd:10,val:600,sz:[1,1],eff:'范围眩晕'},
 horn:{n:'小喇叭',ic:'📯',cat:'loot',fn:'repel',cd:12,val:700,sz:[1,2],eff:'吓退怪物'},
 glasses:{n:'墨镜',ic:'🕶️',cat:'loot',fn:'eye',cd:16,val:800,sz:[2,1],eff:'透视容器'},
 umbrella:{n:'雨伞',ic:'☂️',cat:'loot',fn:'umb',cd:18,val:900,sz:[1,3],eff:'短时免伤'},
 magnet:{n:'磁铁',ic:'🧲',cat:'loot',fn:'mag',cd:18,val:900,sz:[1,1],eff:'吸取掉落物'},
 hat:{n:'魔术帽',ic:'🎩',cat:'loot',fn:'invis',cd:24,val:1200,sz:[2,2],eff:'隐身'},
 blind:{n:'盲盒',ic:'🎁',cat:'blind',val:500,sz:[1,1]},
 wood:{n:'木材',ic:'🪵',cat:'mat',val:80,sz:[1,2]},
 cloth:{n:'布料',ic:'🧵',cat:'mat',val:60,sz:[1,1]},
};
const CATN={weapon:'武器',med:'药品',ball:'精灵球',loot:'战利品',blind:'盲盒',mat:'材料'};
const PH={weapon:'🔪',med:'🧪',ball:null,loot:'🎩'};
const BALLN={catch:'命中后概率收服，失败则定身',ice:'范围冰冻',flash:'范围致盲'};

/* ---------- 实例 ---------- */
let S,UID=1,SC=1,CS=72;
const maxUse=e=>DEF[e.id].uses?DEF[e.id].uses+Math.floor((e.q-1)/2):0;
const left=e=>DEF[e.id].uses?e.u:e.n;
const mk=(id,q,n)=>{const d=DEF[id],e={uid:UID++,id,q:q||1};if(d.cat==='weapon')e.dur=maxDur(e);else if(d.uses){e.n=1;e.u=maxUse(e)}else if(d.cat==='med'||d.cat==='ball')e.n=n||1;else if(d.fn)e.cdT=0;return e};
const maxDur=e=>Math.round(DEF[e.id].dur*QM[e.q]);
const dmgOf=e=>Math.round(DEF[e.id].dmg*(e.id==='fist'?1:QM[e.q]));
const cdOf=e=>Math.round(DEF[e.id].cd*(1-.08*(e.q-1)));
const healOf=e=>Math.round((DEF[e.id].heal||0)*QM[e.q]);
const useT=e=>+(DEF[e.id].t*(1-.06*(e.q-1))).toFixed(1);
const ival=e=>Math.round(DEF[e.id].val*QV[e.q]*(DEF[e.id].uses?e.u/maxUse(e):(e.n||1)));
const unitV=e=>Math.round(DEF[e.id].val*QV[e.q]);
const fmt=v=>Math.round(v).toLocaleString();
const KIND=e=>{const c=DEF[e.id].cat;return c==='weapon'?0:c==='med'?1:c==='ball'?2:DEF[e.id].fn?3:4};
const skey=e=>e.id+'|'+e.q;
const stackable=e=>{const d=DEF[e.id];return !d.uses&&(d.cat==='med'||d.cat==='ball')};
function icHTML(e,cls=''){const d=DEF[typeof e==='string'?e:e.id];if(d.ball)return `<span class="pb ${cls}" style="--bt:${d.bt}"></span>`;return `<span class="emo ${cls}">${d.ic}</span>`}
function durBar(e){const p=e.dur/maxDur(e);return `<span class="dbar"><i class="${p<.3?'low':''}" style="width:${p*100}%"></i></span>`}

/* ---------- 网格 ---------- */
const SZ=id=>DEF[id].sz;
const dims=p=>{const s=SZ(p.e.id);return p.r?[s[1],s[0]]:[s[0],s[1]]};
function gridOf(z){return z==='bag'?{W:CFG.bagW,H:CFG.bagH,L:S.bag}:z==='wh'?{W:5,H:40,L:S.wh}:{W:SAFE_LV[CFG.safeLv-1],H:1,L:S.safe}}
function overl(g,x,y,w,h,ign){return g.L.filter(p=>{if(p===ign)return false;const[pw,ph]=dims(p);return x<p.x+pw&&p.x<x+w&&y<p.y+ph&&p.y<y+h})}
function fits(g,w,h,x,y,ign){if(x<0||y<0||x+w>g.W||y+h>g.H)return false;return !overl(g,x,y,w,h,ign).length}
function spot(g,id,pref){const s=SZ(id);let tr=s[0]===s[1]?[0]:[0,1];if(pref==='h'&&s[0]<s[1])tr=[1,0];for(let y=0;y<g.H;y++)for(let x=0;x<g.W;x++)for(const r of tr){const w=r?s[1]:s[0],h=r?s[0]:s[1];if(fits(g,w,h,x,y))return {x,y,r}}return null}
function place(z,e,pref){const g=gridOf(z),s=spot(g,e.id,pref);if(!s)return false;g.L.push({e,x:s.x,y:s.y,r:s.r});return true}
const bagItems=()=>S.bag.map(p=>p.e);
function entry(uid){let p=S.bag.find(p=>p.e.uid===uid);if(p)return {p,z:'bag'};p=S.safe.find(p=>p.e.uid===uid);if(p)return {p,z:'safe'};p=(S.wh||[]).find(p=>p.e.uid===uid);if(p)return {p,z:'wh'};return null}
function removeEntry(z,p){const L=LZ(z);const i=L.indexOf(p);if(i>=0)L.splice(i,1)}
function rankCmp(a,b){const ka=KIND(a),kb=KIND(b);if(ka!==kb)return ka-kb;if(a.q!==b.q)return b.q-a.q;const va=DEF[a.id].val,vb=DEF[b.id].val;if(va!==vb)return vb-va;if(a.id!==b.id)return a.id<b.id?-1:1;if(ka===0)return b.dur-a.dur;return (b.n||0)-(a.n||0)}
const areaOf=e=>{const s=SZ(e.id);return s[0]*s[1]};
function sortCmp(a,b){const ka=WTYPE(a),kb=WTYPE(b);if(ka!==kb)return ka-kb;const aa=areaOf(a),ab=areaOf(b);if(aa!==ab)return ab-aa;const la=longOf(a),lb=longOf(b);if(la!==lb)return lb-la;return rankCmp(a,b)}
function mergeStacks(list,mm){const m={},out=[];list.forEach(e=>{if(stackable(e))(m[skey(e)]=m[skey(e)]||[]).push(e);else out.push(e)});for(const k in m){const f=m[k][0],src=m[k];let t=src.reduce((a,e)=>a+e.n,0),i=0,head=null;while(t>0){const c=Math.min(t,CFG.stack),ne=mk(f.id,f.q,c);if(src[i])ne.uid=src[i].uid;if(!head)head=ne.uid;out.push(ne);t-=c;i++}if(mm)for(let j=i;j<src.length;j++)mm[src[j].uid]=head}return out}
function sortBag(silent){
 const old=S.bag,keepW=S.wbar.slice(),keepB=S.ballKey,from={},mm={};
 old.forEach(p=>{const [w,h]=dims(p);from[p.e.uid]={x:p.x,y:p.y,w,h,q:p.e.q,html:cellInner(p.e,w,h,'bag')}});
 const all=mergeStacks(bagItems(),mm).sort(sortCmp);S.bag=[];
 for(const e of all)if(!place('bag',e,'h')){S.bag=old;if(!silent)toast('空间不足，整理失败','warn');return false}
 S.wbar=keepW;S.ballKey=keepB;if(!silent){S._flip={from,mm,z:'bag'};toast('已整理','ok');log('整理背包')}return true;
}
/* 整理动画：物品飞向新位置，被合并的堆叠飞向目标堆后淡出（0.45s） */
function playFlip(zz){const f=S._flip;S._flip=null;if(!f)return;const z=zz||f.z||'bag';const g=document.querySelector('.bgrid[data-grid="'+z+'"]');if(!g)return;
 const els={};g.querySelectorAll('.cell[data-src="'+z+'"]').forEach(c=>els[c.dataset.uid]=c);const mv=[],gh=[];
 for(const uid in els){const o=f.from[uid];if(!o)continue;const c=els[uid],dx=o.x*CS+2-parseFloat(c.style.left),dy=o.y*CS+2-parseFloat(c.style.top);if(!dx&&!dy)continue;c.style.transition='none';c.style.transform=`translate(${dx}px,${dy}px)`;c.style.zIndex=6;mv.push(c)}
 for(const uid in f.mm){const o=f.from[uid],t=els[f.mm[uid]];if(!o||!t)continue;const d=document.createElement('div');d.className='cell q'+o.q;d.style.cssText=`left:${o.x*CS+2}px;top:${o.y*CS+2}px;width:${o.w*CS-4}px;height:${o.h*CS-4}px;z-index:7;pointer-events:none`;d.innerHTML=o.html;g.appendChild(d);gh.push([d,t])}
 g.offsetWidth;
 mv.forEach(c=>{c.style.transition='transform .45s cubic-bezier(.3,.7,.2,1)';c.style.transform=''});
 gh.forEach(([d,t])=>{d.style.transition='all .45s cubic-bezier(.3,.7,.2,1)';d.style.left=t.style.left;d.style.top=t.style.top;d.style.opacity='0'});
 setTimeout(()=>{gh.forEach(([d])=>d.remove());mv.forEach(c=>{c.style.transition='';c.style.zIndex=''})},520)}

/* ---------- 武器栏 ---------- */
const isW=e=>DEF[e.id].cat==='weapon';
const bagW=()=>bagItems().filter(isW).sort(rankCmp);
const byUid=u=>u?bagItems().find(e=>e.uid===u)||null:null;
function syncBar(){
 if(!S.wbar||S.wbar.length!==CFG.wSlots)S.wbar=Array(CFG.wSlots).fill(null).map((_,i)=>S.wbar&&S.wbar[i]||null);
 S.wbar=S.wbar.map(u=>byUid(u)?u:null);
 const l=bagW();for(let i=0;i<S.wbar.length;i++)if(!S.wbar[i]){const n=l.find(e=>!S.wbar.includes(e.uid));if(n)S.wbar[i]=n.uid}
 if(S.curSlot<0||S.curSlot>=S.wbar.length||!S.wbar[S.curSlot])S.curSlot=S.wbar.findIndex(u=>u);
}
const cur=()=>{syncBar();return S.curSlot>=0?byUid(S.wbar[S.curSlot]):null};
const fistE={id:'fist',q:1};
function selectW(i){syncBar();if(!S.wbar[i])return;if(S.hand==='w'&&S.curSlot===i)return;S.curSlot=i;S.hand='w';cancelUse();flashKey='w'+i;refresh()}
function cycleW(){syncBar();const o=S.wbar.map((u,i)=>u?i:-1).filter(i=>i>=0);if(!o.length)return;if(S.hand!=='w')return selectW(S.curSlot<0?o[0]:S.curSlot);if(o.length>1)selectW(o[(o.indexOf(S.curSlot)+1)%o.length])}
function equipW(e){syncBar();const i=S.wbar.indexOf(e.uid);if(i>=0){S.curSlot=i;S.hand='w';flashKey='w'+i;return refresh()}
 const s=S.curSlot<0?0:S.curSlot;S.wbar[s]=e.uid;S.curSlot=s;S.hand='w';cancelUse();flashKey='w'+s;toast(`${DEF[e.id].n} → 武器栏${s+1}`,'ok');refresh()}
function weaponBreak(w){const en=entry(w.uid);if(en)removeEntry(en.z,en.p);const n=cur();flashKey='w'+S.curSlot;toast(n?`${DEF[w.id].n} 损坏，已补位`:`${DEF[w.id].n} 损坏`,'warn');log(`${DEF[w.id].n} 损坏`)}

/* ---------- 精灵球 ---------- */
const ballCnt=k=>bagItems().reduce((a,e)=>a+(KIND(e)===2&&skey(e)===k?e.n:0),0);
function ballKeys(){const ks=[];bagItems().filter(e=>KIND(e)===2).sort(rankCmp).forEach(e=>{if(!ks.includes(skey(e)))ks.push(skey(e))});return ks}
function curBall(){if(S.ballKey&&ballCnt(S.ballKey))return S.ballKey;const k=ballKeys()[0]||null;if(k!==S.ballKey&&S.ballKey&&k)flashKey='b';S.ballKey=k;return k}
const kq=k=>+k.split('|')[1],kid=k=>k.split('|')[0];
function holdBall(){const k=curBall();if(!k)return toast('没有精灵球','warn');if(S.hand==='b')return;S.hand='b';cancelUse();flashKey='b';refresh()}
function ballTap(){holdBall()}
function throwBall(){
 const k=curBall();if(!k){S.hand='w';return refresh()}
 if(S.atkCd>0)return;S.atkCd=.5;
 const p=S.bag.filter(x=>KIND(x.e)===2&&skey(x.e)===k).sort((a,b)=>a.e.n-b.e.n)[0];p.e.n--;if(p.e.n<=0)removeEntry('bag',p);
 const t=nearest(460);if(t){const l=Math.hypot(t.x-S.x,t.y-S.y)||1;S.fx=(t.x-S.x)/l;S.fy=(t.y-S.y)/l}
 S.projs.push({x:S.x+S.fx*30,y:S.y+S.fy*30,vx:S.fx*560,vy:S.fy*560,life:.85,ball:DEF[kid(k)].ball,q:kq(k),bt:DEF[kid(k)].bt});
 press('#bMain');log(`投掷 ${QN[kq(k)]}·${DEF[kid(k)].n}`);
 if(!ballCnt(k)){const n=curBall();if(!n){S.hand='w';toast('精灵球用完','info')}}
 refresh();
}
function ballHit(p,m){
 const q=p.q,x=p.x,y=p.y;
 if(p.ball==='catch'){const ch=Math.min(.95,QB[q]*(m.hp/m.max<.5?1.4:1));
  if(Math.random()<ch){S.mons.splice(S.mons.indexOf(m),1);S.caps++;S.respawn=3;burst(m.x,m.y,'#ffffff',22,180);floatTxt(m.x,m.y-50,'收服','#ffd166');
   const e=mk(m.t==='bear'?'capBear':'capWorm',q);if(!place('bag',e))S.ground.push({e,x:m.x,y:m.y,lock:0});else toast(`收服 ${DEF[e.id].n}`,'gold');log(`收服 ${m.nm}`);refresh()}
  else{m.stun=QS[q];floatTxt(m.x,m.y-50,'挣脱','#ffdf6b');burst(m.x,m.y,'#e8463f',10)}}
 else if(p.ball==='ice'){const R=80+12*q;S.parts.push({x,y,ring:1,t:.6,T:.6,R,c:'#8fe3ff'});S.mons.forEach(o=>{if(Math.hypot(o.x-x,o.y-y)<R+o.r){o.stun=QS[q]*1.2;o.ice=o.stun}});floatTxt(x,y-40,'冰冻','#8fe3ff')}
 else{const R=110+14*q;S.parts.push({x,y,ring:1,t:.5,T:.5,R,c:'#fff3a0'});S.flash=.25;S.mons.forEach(o=>{if(Math.hypot(o.x-x,o.y-y)<R+o.r)o.blind=QS[q]*1.5});floatTxt(x,y-40,'致盲','#fff3a0')}

 if(hv.zone==='drop'){if(sel.src==='box')return;const e=takeOut();toGround(e);log(`丢弃 ${nm}`);return}
 if(hv.zone==='box'){if(sel.src==='box')return;const e=takeOut();S.box.items.push({e,rev:true});return}
 if(hv.zone==='whin'){if(sel.src==='wh')return;const e=takeOut();if(!intoWh(e)){putBack(sel.src,e,o.p);return toast('位置放不下了','warn')}toast(`${nm} → 仓库`,'ok');return}
 const c=hv.c;if(!c||!c.ok)return toast(c?c.why:'位置放不下了','warn');
 if(sel.src==='box'&&o.e.bound==='other')return toast('无法拾取其他玩家的物品','warn');
 if(c.merge){const k=Math.min(o.e.n,CFG.stack-c.merge.e.n);c.merge.e.n+=k;o.e.n-=k;if(!o.e.n)takeOut();return}
 if(c.swap){c.swap.moves.forEach(m=>{const cz=entry(m.p.e.uid);if(cz)removeEntry(cz.z,cz.p)});c.swap.moves.forEach(m=>LZ(m.to).push({e:m.p.e,x:m.x,y:m.y,r:m.r}));syncBar();toast('已交换','ok');return}
 if(c.auto)toast('已自动旋转','ok');
 if(sel.src===hv.zone){o.p.x=hv.tx;o.p.y=hv.ty;o.p.r=hv.r;return}
 const e=takeOut();LZ(hv.zone).push({e,x:hv.tx,y:hv.ty,r:hv.r});syncBar();
 if(hv.zone==='bag'&&KIND(e)===0&&!cur()){syncBar();S.hand='w'}
}

 S.wh.slice().sort((a,b)=>a.y-b.y||a.x-b.x).filter(p=>(!war||WAR(p.e))&&(!toy||WTYPE(p.e)===5)&&(f.cat<0||WTYPE(p.e)===f.cat)&&(!f.q||p.e.q===f.q)).forEach(p=>{const s=spot(g,p.e.id,'h');if(s){const np={e:p.e,x:s.x,y:s.y,r:s.r};g.L.push(np);out.push(np)}});

function collide(o,r,skip){o.x=Math.max(r,Math.min(W-r,o.x));o.y=Math.max(110+r,Math.min(H-r,o.y));if(skip)return;

 for(const k in S.ef)S.ef[k]=Math.max(0,S.ef[k]-dt);
 [...S.bag,...S.safe].forEach(p=>{if(p.e.cdT>0)p.e.cdT=Math.max(0,p.e.cdT-dt)});
 if(S.use){S.use.t+=dt;if(S.use.t>=S.use.T)finishUse()}
 if(S.z>0||S.vz>0){S.z+=S.vz*dt;S.vz-=1600*dt;const ob=S.vz<0&&S.z<ELEV+20&&OBST.find(o=>S.x>=o.x&&S.x<=o.x+o.w&&S.y>=o.y&&S.y<=o.y+o.h);if(ob&&S.onTop!==ob){S.z=0;S.vz=0;landCheck()}else if(S.z<=0){S.z=0;S.vz=0;landCheck()}}
 let mx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.dx,my=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.dy;const l=Math.hypot(mx,my);
 if(S.dashT>0){S.dashT-=dt;S.x+=S.dvx*dt;S.y+=S.dvy*dt;S.ghosts.push({x:S.x,y:S.y-elev(),z:S.z,t:.25})}
 else if(l>.1){mx/=Math.max(1,l);my/=Math.max(1,l);const sp=190*(S.spdT>0?1.4:1)*(S.use?.6:1)*(S.run?CFG.runMul:1);S.x+=mx*sp*dt;S.y+=my*sp*dt;const n=Math.hypot(mx,my);S.fx=mx/n;S.fy=my/n;S.walk+=dt*(S.run?15:10);
  if(S.run){S.st=Math.max(0,S.st-CFG.runDrain*dt);if(S.st<=0){S.run=false;refresh()}}else S.st=Math.min(S.stMax,S.st+6*dt)}
 else S.st=Math.min(S.stMax,S.st+14*dt);
 if(S.onTop&&S.z<=0){const b=S.onTop;if(!(S.x>=b.x-4&&S.x<=b.x+b.w+4&&S.y>=b.y-4&&S.y<=b.y+b.h+4)){S.onTop=null}}

 S.ghosts.forEach(g=>g.t-=dt);S.ghosts=S.ghosts.filter(g=>g.t>0);
 for(let i=S.ground.length-1;i>=0;i--){const g=S.ground[i];let d=Math.hypot(g.x-S.x,g.y-S.y);

  const dx=S.x-m.x,dy=S.y-m.y,d=Math.hypot(dx,dy)||1;

  else if(m.blind>0){m.blind-=dt;m.x+=Math.cos(S.beam*2+m.y)*40*dt;m.y+=Math.sin(S.beam*2+m.x)*40*dt}
  else if(m.flee>0){m.flee-=dt;m.x-=dx/d*120*dt;m.y-=dy/d*120*dt}

   if(d<52&&m.atkCd<=0){m.atkCd=1.2;if(S.onTop)floatTxt(m.x,m.y-44,'够不着','#ffd166');else if(S.z>15||S.dashT>0)floatTxt(S.x,S.y-60,'MISS','#9ecbff');else if(S.ef.umb>0)floatTxt(S.x,S.y-60,'挡住','#7fd1ff');else{S.hp-=8;floatTxt(S.x,S.y-50,'-8','#ff6b5b');if(S.hp<=0){S.hp=0;settle(false)}}}}
