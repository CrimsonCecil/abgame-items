<meta charset="UTF-8">

<title>ABGame · 武器策划案</title>
<meta name="description" content="ABGame 武器设计初稿：近战 / 远程各 3 个品阶、每个品阶 3 把备选，共 18 把。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F2E9DA; --paper:#FBF6EC; --paper2:#F6EEDF; --ink:#2C241E; --muted:#776656; --faint:#A8988A; --line:#E3D5C0;
  --mint:#2A9E86; --mint-soft:#D7EEE6;
  --prank:#F06A47; --moment:#7E5CE6; --loot:#D8941A;
  --night:#1F2734;
  --q0:#D9D9D9; --q1:#6CC870; --q2:#4F9BEA; --q3:#A86CE2; --q4:#F2B53A; --q5:#EE5148;
  --font-d:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;
  --font-b:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --r:18px; --r-sm:12px;
  --sh:0 1px 0 rgba(60,40,20,.06),0 8px 24px -14px rgba(60,40,20,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.65;
  background-image:radial-gradient(rgba(120,90,60,.07) 1px,transparent 1px);background-size:18px 18px}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:6px}

.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px 18px;border-right:1.5px dashed var(--line);background:rgba(251,246,236,.75);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;padding:4px 6px 10px}
.stamp{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--font-d);font-size:20px;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--mint)}
.brand b{display:block;font-family:var(--font-d);font-weight:400;font-size:20px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.04em}
#nav{display:flex;flex-direction:column;gap:2px}
.ng{margin-top:10px;font-size:12px;color:var(--faint);letter-spacing:.12em;padding:0 8px 4px;display:flex;align-items:center;gap:6px}
.ng i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nl{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink);transition:background .15s}
.nl:hover{background:var(--paper2)}
.nl.on{background:var(--ink);color:var(--paper)}
.nl img{width:26px;height:26px;border-radius:7px;background:#F4EBDD}
.nl .num{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--paper2);font-size:12px;color:var(--muted);font-weight:700}
.nl.on .num{background:#463b33;color:var(--paper)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px}

/* ---------- main ---------- */
main{padding:28px clamp(16px,4vw,56px) 80px;max-width:1180px;width:100%;outline:none}
.page{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;font-weight:400}
h1{font-family:var(--font-d);font-size:clamp(30px,4vw,46px);line-height:1.15}
h2{font-family:var(--font-d);font-size:28px;line-height:1.2}
h3{font-family:var(--font-b);font-weight:700;font-size:17px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h .idx{font-family:var(--font-d);color:var(--paper);background:var(--ink);border-radius:8px;padding:0 9px;font-size:16px}
.sec-h p{color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;color:#fff;letter-spacing:.04em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);white-space:nowrap}
.chip b{color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{border-left:4px solid var(--mint);background:var(--mint-soft);padding:10px 14px;border-radius:0 12px 12px 0;font-size:14px}
.note.warn{border-color:var(--prank);background:#FCE3DA}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:24px;overflow:hidden;min-height:380px;display:flex;align-items:flex-end;background:var(--night);box-shadow:var(--sh)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,22,32,.92) 0%,rgba(18,22,32,.65) 42%,rgba(18,22,32,0) 75%)}
.hero-c{position:relative;z-index:1;padding:32px;max-width:560px;color:#F7F1E6}
.hero-c .eyebrow{color:#9FE3D2}
.hero-c h1{margin:8px 0 12px}
.hero-c p{color:#DCD3C6;font-size:15px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-pills span{font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 10px;color:#EDE6DA}

.pillar{position:relative;overflow:hidden}
.pillar .big{font-family:var(--font-d);font-size:26px}
.pillar .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.pillar ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}

.icard{display:flex;flex-direction:column;gap:10px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;padding:14px}
.icard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(60,40,20,.4)}
.icard .top{display:flex;gap:12px;align-items:center}
.icard img{width:64px;height:64px;border-radius:14px;background:#F4EBDD;flex:none}
.icard h3{font-size:17px}
.icard .en{font-size:12px;color:var(--faint)}
.icard p{font-size:13px;color:var(--muted);line-height:1.55}
.bars{display:grid;gap:4px}
.bars div{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.bars span{height:6px;border-radius:9px;background:var(--paper2);overflow:hidden;display:block}
.bars span i{display:block;height:100%;border-radius:9px}

/* ---------- item page ---------- */
.ihead{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center}
.ihead .pic{width:150px;height:150px;border-radius:28px;background:#F4EBDD;border:1.5px solid var(--line);box-shadow:var(--sh);transform:rotate(-3deg)}
.ihead h1 small{font-family:var(--font-b);font-size:15px;color:var(--faint);margin-left:10px;letter-spacing:.04em}
.ihead .pitch{font-size:18px;margin:10px 0 14px;max-width:680px;line-height:1.55}
.ihead .chips{display:flex;flex-wrap:wrap;gap:8px}
.ihead .bars{max-width:340px;margin-top:14px}
.subnav{position:sticky;top:0;z-index:5;margin:26px -6px 0;padding:10px 6px;display:flex;gap:6px;overflow-x:auto;background:linear-gradient(var(--bg) 70%,rgba(242,233,218,0));scrollbar-width:none}
.subnav a{font-size:13px;text-decoration:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.subnav a:hover{border-color:var(--ink)}

.stage{background:var(--night);border-radius:22px;padding:14px;box-shadow:var(--sh);position:relative}
.stage .sk{width:100%;height:auto;display:block;border-radius:14px}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#C9C2B6;font-size:13px;padding:10px 4px 0;flex-wrap:wrap}
.stage-bar .btns{display:flex;gap:6px}
.stage-bar button{background:#2D3646;color:#F4EFE6;border:1px solid #435069;border-radius:99px;padding:4px 12px;font-size:12px}
.stage-bar button:hover{background:#3A4559}
.stage.paused .anim,.stage.paused .beam,.stage.paused .pulse,.stage.paused .spin,.stage.paused .glow{animation-play-state:paused!important}
.lv{display:inline-flex;align-items:center;gap:6px}
.lv i{width:8px;height:8px;border-radius:50%;background:#FF5252;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.board{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--sh)}
.board .sk{width:100%;height:auto;border-radius:10px;display:block}
.board p{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 4px 2px}
.board p b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px}
.art{border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--sh)}
.art img{width:100%;aspect-ratio:16/8;object-fit:cover}
.art span{position:absolute;left:12px;bottom:10px;background:rgba(20,24,32,.75);color:#F4EFE6;font-size:12px;padding:3px 10px;border-radius:99px}

.fun{padding:16px}

.fun h3{margin:6px 0 4px}
.fun p{font-size:14px;color:var(--muted)}

/* flow */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.fstep{position:relative;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:22px;box-shadow:3px 3px 0 var(--line);text-align:center}
.flow>.fstep:last-child,.flow>.fdec:last-child{margin-bottom:0}
.fstep::after,.fdec>.fq::after{content:"";position:absolute;left:50%;bottom:-19px;width:2px;height:16px;background:var(--ink);transform:translateX(-50%)}
.fstep::before{content:"";position:absolute;left:50%;bottom:-21px;border:5px solid transparent;border-top:6px solid var(--ink);transform:translateX(-50%)}
.flow>.fstep:last-child::after,.flow>.fstep:last-child::before{display:none}
.fdec{margin-bottom:22px;position:relative}
.fq{position:relative;margin:0 auto 22px;width:max-content;max-width:100%;background:#FFE9A8;border:1.5px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--line)}
.fbr{display:flex;gap:10px;align-items:flex-start}
.fcol{flex:1;min-width:0;border:1.5px dashed var(--faint);border-radius:14px;padding:22px 10px 10px;position:relative;background:rgba(255,255,255,.35)}
.flabel{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:1px 10px;border-radius:99px;white-space:nowrap}
.fcol .fstep{font-size:13px;padding:6px 8px;box-shadow:2px 2px 0 var(--line)}
.flow-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}

/* scenario */
.scn{padding:10px}
.scn .sk{width:100%;border-radius:12px;display:block}
.scn h3{margin:10px 4px 2px;font-size:16px}
.scn p{margin:0 4px 4px;font-size:13px;color:var(--muted)}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.tbl th,.tbl td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700;color:var(--muted);white-space:nowrap}
.tbl thead th{font-size:13px}
.qh{display:inline-flex;align-items:center;gap:6px}
.qh i{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(0,0,0,.25)}
.tbl td.dim{color:var(--faint)}
.tscroll{overflow-x:auto;border-radius:16px}

.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{display:block;position:relative;padding-left:18px;font-size:14px}
.list li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:2px;background:var(--c,var(--ink));transform:rotate(45deg)}

.req{padding:14px}
.req h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.req h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.req ul{margin:0;padding-left:16px;font-size:13px;color:var(--muted)}

.pn{display:flex;justify-content:space-between;gap:12px;margin-top:48px}
.pn a{flex:1;text-decoration:none;display:flex;align-items:center;gap:12px;padding:12px 16px}

.pn small{display:block;color:var(--faint);font-size:12px}

/* rules page */
.ctype{padding:12px}
.ctype .sk{width:100%;border-radius:12px}
.ctype h3{margin:10px 2px 2px}
.ctype p{font-size:13px;color:var(--muted);margin:0 2px}

.vers .vh{font-size:11px;color:var(--faint);letter-spacing:.14em}
.vers .ver{display:flex;align-items:baseline;gap:8px;text-decoration:none;padding:3px 8px;border-radius:8px;font-size:12px;color:var(--ink)}
.vers .ver b{font-family:var(--font-d);font-weight:400;font-size:15px}
.vers .ver span{color:var(--muted);font-size:11px}
.vers .ver:hover{background:var(--paper2)}
.vers .ver.on{background:var(--ink);color:var(--paper)}.vers .ver.on span{color:#CFC4B6}
.vers .all{font-size:12px;text-align:right;color:var(--muted);text-decoration:none;padding:0 4px}
.vers .all:hover{color:var(--ink)}
@media (max-width:860px){.vers{display:none}}
.shelftag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;color:#fff;background:#8A7C70}
.shelftag.defer{background:#D8941A}.shelftag.alt{background:#7E5CE6}
.rs .why{margin-top:6px;font-size:12px;color:#8A7C70;border-top:1px dashed var(--line);padding-top:6px}

/* ---------- 武器文档 ---------- */
.tag.origin.wp{background:#2C241E;color:#fff}
.rectag{font-size:10px;font-weight:700;color:#1D7A66;background:#D7EEE6;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;font-style:normal;white-space:nowrap}
.matrix{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.mx-th{background:var(--paper);border:1.5px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:10px 12px;display:grid;gap:2px;align-content:center}
.mx-th b{font-family:var(--font-d);font-weight:400;font-size:22px;color:var(--c);line-height:1.1}
.mx-th span{font-size:13px;font-weight:700}
.mx-th small{color:var(--muted);font-size:12px}
.mx-rh{display:flex;flex-direction:column;justify-content:center;gap:4px;border:1.5px solid var(--line);border-left:6px solid var(--c);padding:6px 10px;background:var(--paper);border-radius:12px}
.mx-rh b{font-family:var(--font-d);font-weight:400;font-size:24px;color:var(--c);line-height:1.1}
.mx-rh span{font-size:12px;color:var(--muted)}
.mx-cell{position:relative;display:grid;gap:10px;align-content:start;border:2px dashed color-mix(in srgb,var(--c) 55%,#fff);border-radius:16px;padding:26px 10px 10px;background:rgba(255,255,255,.35)}
.mx-tip{position:absolute;top:-11px;left:12px;background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:1px 10px;border-radius:99px;white-space:nowrap}
.wcard{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;color:inherit;padding:10px;transition:transform .15s,box-shadow .15s}
.wcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(60,40,20,.4)}
.wcard img{width:64px;height:64px;object-fit:contain;background:#F4EBDD;border-radius:12px;padding:4px}
.wcard h3{font-size:15px;padding-right:44px}
.wcard p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wcard .rstags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.wcard .chip{font-size:11px;padding:1px 8px}
.mchip.cur{background:var(--ink);color:var(--paper)}
.mchip .rvdot{margin-left:2px}
.slotbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;padding:8px 12px;border:1.5px dashed var(--c);border-radius:14px;background:var(--paper)}
.slotbar .sb-l{font-size:13px;font-weight:700;color:var(--c);margin-right:4px}
.picnote{font-size:11px;color:var(--faint);text-align:center;margin-top:10px}
.ihead .pic{object-fit:contain;padding:10px}
.rt{display:inline-grid;place-items:center;min-width:30px;height:26px;border-radius:8px;font-weight:700;font-size:15px;line-height:1}
.rt.r0{background:#D7EEE6;color:#1D7A66}.rt.r1{background:#E1ECFA;color:#2F66A8}.rt.r2{background:#FBEFD2;color:#9A6B1B}.rt.r3{background:#FCE3DA;color:#B8432A}
.mon{border-top:5px solid var(--c)}
.mon .mh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mon .mh b{font-size:16px}
.mon .ans{margin-top:8px;font-size:13px;color:#1D7A66}
.mon .ans b{display:block;font-size:12px;opacity:.8}
.monlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.mrow p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mrow b{font-size:14px}
.tiercard{border-top:5px solid var(--c)}
.tiercard .tk{font-size:14px;color:var(--c);letter-spacing:.2em}
.tbl tr.grp td{text-align:left!important;font-weight:700;font-size:13px}
.mxt td,.mxt th{text-align:center}.mxt td:first-child,.mxt th:first-child{text-align:left}
.mxt td[title]{cursor:help}
.numt td,.numt th{font-size:13px;padding:7px 8px}
.numt td:first-child{white-space:nowrap}
.scr{display:grid;gap:6px;margin-top:6px}
.scrow{display:grid;grid-template-columns:60px auto minmax(0,1fr);align-items:center;gap:10px}
.scrow .sl{font-size:14px;font-weight:700}
.scrow .sbtn{display:flex;gap:5px}
.sb{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink);padding:0}
.sb:hover{border-color:var(--ink)}
.sb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scrow .sav{font-size:13px;color:var(--muted)}
.rvsc{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rvsc h4{margin:0 0 4px;font-size:14px}
.rvsc h4 small{color:var(--faint);font-weight:400;margin-left:6px}
.rvhelp{margin-top:6px}
.slotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slotc{border-top:5px solid var(--c);padding:12px}
.slotc .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.slotc .sh span{font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px;white-space:nowrap}
.slotc .sh .ok{background:#D7EEE6;color:#1D7A66}.slotc .sh .warn{background:#FBEFD2;color:#9A6B1B}.slotc .sh .none{background:#EEE6DA;color:#8A7C70}
.slrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;text-decoration:none;color:inherit;padding:4px 6px;border-radius:10px;font-size:14px}
.slrow:hover{background:var(--paper2)}
.slrow img{width:36px;height:36px;object-fit:contain}
.avg small{color:var(--faint)}
.bk .why{font-size:12px;color:#8A7C70;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.bk h3 small{font-weight:400}
@media (max-width:1080px){.matrix{grid-template-columns:minmax(0,1fr)}.mx-th,.mx-corner,.mx-rh{display:none}.mx-cell{margin-top:8px}.slotgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.slotgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.otabs a{padding:8px 11px;font-size:13px;white-space:nowrap}.otabs{overflow-x:auto}}

.hubnav{display:grid;gap:3px;margin:2px 4px 6px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--paper)}
.hubnav .vh{font-size:11px;color:var(--faint);letter-spacing:.14em}
.hubnav a{display:flex;align-items:center;gap:6px;text-decoration:none;padding:3px 8px;border-radius:8px;font-size:12px;color:var(--ink)}
.hubnav a:hover{background:var(--paper2)}
.hubnav a.on{background:var(--ink);color:var(--paper)}
.hubfab{display:none}
@media (max-width:860px){.hubnav{display:none}.hubfab{display:flex;position:fixed;left:10px;bottom:10px;z-index:30;gap:4px;background:var(--paper);border:1.5px solid var(--ink);border-radius:99px;padding:3px 4px;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}.hubfab a{font-size:12px;font-weight:700;text-decoration:none;color:var(--ink);padding:3px 10px;border-radius:99px;white-space:nowrap}.hubfab a.on{background:var(--ink);color:var(--paper)}}

<script>

/* ABGame 功能战利品 · 草图引擎
 * 用一行字符串描述一个元素：  type x[,y] flag flag k:...
 *   x 为水平位置，y 为相对地面的高度（负数向上）
 *   flags: me / foe / ally（阵营）  f（朝左） qN（品质 0-5） sN（缩放） oN（透明度） rN（旋转）
 *          to:x,y（箭头终点）  len:N  w:N  h:N  open  shock  sly  label:文字  t:文字（必须放最后）
 *   k:pct,dx,dy,op,rot,sc,sx;pct,...  关键帧（一个循环内的位移/透明度/旋转/缩放）
 */
(function () {
  const Q = ['#D9D9D9', '#6CC870', '#4F9BEA', '#A86CE2', '#F2B53A', '#EE5148'];
  const TEAM = { me: '#3FD6B2', ally: '#8FE6CF', foe: '#FF8169' };
  const INK = '#151A22';
  let uid = 0;

  /* ---------- 解析 ---------- */
  function parse(str) {
    return str.split('|').map(s => s.trim()).filter(Boolean).map(seg => {
      const tIdx = seg.indexOf(' t:');
      let text = null;
      if (tIdx >= 0) { const rest = seg.slice(tIdx + 3); const m = rest.match(/\s+(?=[a-z]+:)/); text = m ? rest.slice(0, m.index) : rest; seg = seg.slice(0, tIdx) + (m ? rest.slice(m.index) : ''); }
      const tok = seg.split(/\s+/);
      const e = { type: tok[0], x: 0, y: 0, o: {} };
      if (text !== null) e.o.t = text;
      if (tok[1] !== undefined) {
        const p = tok[1].split(',').map(Number);
        e.x = p[0]; e.y = p[1] || 0;
      }
      for (const t of tok.slice(2)) {
        if (t === 'me' || t === 'foe' || t === 'ally') e.o.team = t;
        else if (t === 'f') e.o.flip = true;
        else if (/^q\d$/.test(t)) e.o.q = +t.slice(1);
        else if (/^s[\d.]+$/.test(t)) e.o.s = +t.slice(1);
        else if (/^o[\d.]+$/.test(t)) e.o.op = +t.slice(1);
        else if (/^r-?[\d.]+$/.test(t)) e.o.r = +t.slice(1);
        else if (t.startsWith('k:')) e.k = t.slice(2).split(';').map(r => r.split(',').map(v => v === '' ? NaN : Number(v)));
        else if (t.includes(':')) {
          const [a, b] = t.split(':');
          e.o[a] = b.includes(',') ? b.split(',').map(Number) : (isNaN(+b) ? b : +b);
        } else e.o[t] = true;
      }
      return e;
    });
  }

  function normK(k) {
    const out = []; let prev = [0, 0, 0, 1, 0, 1, 1];
    for (const r of k) {
      const row = prev.slice();
      r.forEach((v, i) => { if (!isNaN(v)) row[i] = v; });
      out.push(row); prev = row;
    }
    if (out[0][0] !== 0) out.unshift([0].concat(out[0].slice(1)));
    if (out[out.length - 1][0] !== 100) out.push([100].concat(out[out.length - 1].slice(1)));
    return out;
  }
  function interp(k, p) {
    for (let i = 0; i < k.length - 1; i++) {
      const a = k[i], b = k[i + 1];
      if (p >= a[0] && p <= b[0]) {
        const f = b[0] === a[0] ? 1 : (p - a[0]) / (b[0] - a[0]);
        return a.map((v, j) => j === 0 ? p : v + (b[j] - v) * f);
      }
    }
    return k[k.length - 1];
  }
  const tf = r => `translate(${r[1]}px,${r[2]}px) rotate(${r[4]}deg) scale(${r[5] * r[6]},${r[5]})`;

  /* ---------- 角色 ---------- */
  const st = `stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"`;
  function face(o, ex, ey, mx, my) {
    if (o.shock) return `<circle cx="${ex}" cy="${ey}" r="4.2" fill="#fff" ${st}/><circle cx="${ex + 1}" cy="${ey}" r="1.8" fill="${INK}"/><ellipse cx="${mx}" cy="${my + 2}" rx="3.2" ry="4.2" fill="#7A2633" ${st} stroke-width="1.6"/>`;
    if (o.sly) return `<path d="M${ex - 4} ${ey} q4 -4 8 0" fill="none" ${st} stroke-width="2"/><path d="M${mx - 4} ${my} q4 4 9 -1" fill="none" ${st} stroke-width="2"/>`;
    return `<circle cx="${ex}" cy="${ey}" r="2.4" fill="${INK}"/><path d="M${mx - 3} ${my} q3 3 6 0" fill="none" ${st} stroke-width="1.8"/>`;
  }
  function teamDeco(o) {
    let s = '';
    if (o.team) s += `<ellipse cx="0" cy="2" rx="24" ry="5.5" fill="none" stroke="${TEAM[o.team]}" stroke-width="3.2"/>`;
    return s;
  }
  function label(o, top) {
    if (!o.label) return '';
    const c = o.team ? TEAM[o.team] : '#F4EFE6';
    const w = String(o.label).length * 13 + 14;
    return `<g transform="translate(0,${top})${o.flip ? ' scale(-1,1)' : ''}"><rect x="${-w / 2}" y="-11" width="${w}" height="20" rx="10" fill="${c}" ${st} stroke-width="1.8"/><text x="0" y="4" text-anchor="middle" class="lb">${o.label}</text></g>`;
  }
  const pack = o => `<rect x="-26" y="-44" width="13" height="22" rx="4" fill="${o.team ? TEAM[o.team] : '#8a7a68'}" ${st}/>`;

  const D = {};
  D.rabbit = o => `${teamDeco(o)}${pack(o)}
    <ellipse cx="-7" cy="-86" rx="5.5" ry="16" transform="rotate(-14 -7 -86)" fill="#F7F3EC" ${st}/>
    <ellipse cx="6" cy="-88" rx="5.5" ry="16" transform="rotate(12 6 -88)" fill="#F7F3EC" ${st}/>
    <ellipse cx="6" cy="-88" rx="2.2" ry="10" transform="rotate(12 6 -88)" fill="#F3B6C4"/>
    <ellipse cx="0" cy="-24" rx="17" ry="20" fill="#F7F3EC" ${st}/>
    <circle cx="3" cy="-57" r="16" fill="#F7F3EC" ${st}/>
    ${face(o, 10, -60, 12, -50)}
    <ellipse cx="17" cy="-55" rx="2.4" ry="1.8" fill="#F08AA0"/>
    <ellipse cx="-8" cy="-2" rx="8" ry="4" fill="#F7F3EC" ${st}/><ellipse cx="8" cy="-2" rx="8" ry="4" fill="#F7F3EC" ${st}/>
    ${label(o, -116)}`;
  D.pig = o => `${teamDeco(o)}${pack(o)}
    <ellipse cx="0" cy="-23" rx="22" ry="20" fill="#F5AABA" ${st}/>
    <path d="M-12 -70 l-4 -14 l12 6z M6 -72 l8 -12 l2 14z" fill="#F5AABA" ${st}/>
    <circle cx="2" cy="-55" r="17" fill="#F5AABA" ${st}/>
    <ellipse cx="17" cy="-51" rx="7" ry="5.5" fill="#EC8FA3" ${st}/>
    <circle cx="15" cy="-51" r="1.2" fill="${INK}"/><circle cx="19" cy="-51" r="1.2" fill="${INK}"/>
    ${face(o, 8, -61, 8, -43)}
    <rect x="-14" y="-6" width="9" height="7" rx="2" fill="#E58C9F" ${st}/><rect x="6" y="-6" width="9" height="7" rx="2" fill="#E58C9F" ${st}/>
    ${label(o, -98)}`;
  D.fish = o => `${teamDeco(o)}
    <path d="M-6 -16 L-9 0 M6 -16 L9 0" ${st} stroke-width="3.4"/>
    <path d="M-20 -36 L-40 -52 L-38 -20 Z" fill="#F08A35" ${st}/>
    <rect x="-24" y="-52" width="12" height="20" rx="4" fill="${o.team ? TEAM[o.team] : '#8a7a68'}" ${st}/>
    <ellipse cx="0" cy="-36" rx="25" ry="20" fill="#F7A04E" ${st}/>
    <path d="M-4 -54 q8 -14 16 -2" fill="#F08A35" ${st}/>
    <circle cx="12" cy="-42" r="7.5" fill="#fff" ${st}/>
    <circle cx="${o.shock ? 12 : 14}" cy="-42" r="${o.shock ? 2 : 3.2}" fill="${INK}"/>
    <path d="M${o.shock ? '18 -28 q3 3 0 6' : '16 -29 q4 2 7 -1'}" fill="none" ${st} stroke-width="1.8"/>
    ${label(o, -82)}`;
  D.monster = o => `<ellipse cx="0" cy="3" rx="34" ry="6" fill="#000" opacity=".25"/>
    <path d="M-34 0 C-40 -50 -26 -96 0 -98 C26 -96 40 -50 34 0 l-8 -8 l-9 8 l-8 -8 l-9 8 l-8 -8 l-9 8 l-8 -8 z" fill="#6D6292" ${st}/>
    <circle cx="-10" cy="-62" r="6" fill="#FF5252" class="glow"/><circle cx="12" cy="-62" r="6" fill="#FF5252" class="glow"/>
    <path d="M-12 -40 l5 6 l5 -6 l5 6 l5 -6 l5 6" fill="none" stroke="#F4EFE6" stroke-width="2"/>`;
  D.bird = o => `<ellipse cx="0" cy="-14" rx="14" ry="12" fill="#5AA8F2" ${st}/>
    <ellipse cx="-3" cy="-30" rx="3" ry="8" transform="rotate(-15 -3 -30)" fill="#5AA8F2" ${st}/><ellipse cx="5" cy="-30" rx="3" ry="8" transform="rotate(15 5 -30)" fill="#5AA8F2" ${st}/>
    <path d="M-6 -16 q-14 -14 -18 2 q8 4 18 -2z" fill="#3E8EDB" ${st} class="flap"/>

<script>
/* 评审记录：存云端数据库（weapon_status / weapon_notes / weapon_scores），多人共用；打开在线链接才会上云，本地打开自动退回本机模式 */
(function () {
  const CFG = window.CLOUD_CFG || {};
  const CK = 'abgame-weapon-review/cache1', PK = 'abgame-weapon-review/pending1', VK = 'abgame-weapon-review/voter';
  const ST = {
    adopt: { name: '采纳', color: '#2A9E86', tip: '采纳：入选该槽位，下个版本 CE2.0 制作' },
    defer: { name: '延后', color: '#D8941A', tip: '延后：备用，排到 CE2.0 之后' },
    drop: { name: '摒弃', color: '#8A7C70', tip: '摒弃：落选，归档备查' },
  };
  const jget = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
  const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 存不下就只留内存 */ } };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let VOTER = ''; try { VOTER = localStorage.getItem(VK) || ''; } catch (e) { VOTER = ''; }
  if (!VOTER) { VOTER = 'v' + uid(); try { localStorage.setItem(VK, VOTER); } catch (e) { /* ignore */ } }
  let items = jget(CK, {});          // { id: { status, at, notes: [{id,text,at}], scores: { voter: {fun,clear,cost,at} } } }
  let pending = jget(PK, []);        // 还没写进云端的操作
  let mode = 'init';                 // init | cloud | local | error
  let syncedAt = 0, busy = false, db = null, lastErr = '';
  const subs = [];
  const emit = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  const snap = () => JSON.stringify(items) + '|' + mode + '|' + pending.length + '|' + syncedAt;
  let last = '';
  const notify = () => { const s = snap(); if (s !== last) { last = s; emit(); } };
  const rec = id => { const r = items[id] || (items[id] = { status: '', at: 0, notes: [], scores: {} }); if (!r.scores) r.scores = {}; return r; };

  try {
    const onSite = (() => { try { return CFG.endpoint && location.origin === new URL(CFG.endpoint).origin; } catch (e) { return false; } })();
    if (onSite && window.WorkBuddyCloud && CFG.publishableKey) {
      db = WorkBuddyCloud.createWorkBuddyCloud({ endpoint: CFG.endpoint, oauthRelayBaseUrl: CFG.oauthRelayBaseUrl, publishableKey: CFG.publishableKey }).database;
    }
  } catch (e) { console.warn('云服务初始化失败', e); db = null; }
  if (!db) mode = 'local';

  async function run(op) {
    if (op.t === 'status') return db.from('weapon_status').upsert({ item_id: op.id, status: op.status, updated_at: op.at });
    if (op.t === 'add') return db.from('weapon_notes').upsert({ id: op.note.id, item_id: op.id, body: op.note.text, created_at: op.note.at }, { onConflict: 'id', ignoreDuplicates: true });
    if (op.t === 'del') return db.from('weapon_notes').delete().eq('id', op.nid);
    if (op.t === 'score') return db.from('weapon_scores').upsert({ id: op.voter + ':' + op.id, item_id: op.id, voter: op.voter, fun: op.fun, clear: op.clear, cost: op.cost, updated_at: op.at });
    return { error: null };
  }
  async function flush() {
    if (!db) return true;
    while (pending.length) {
      const r = await run(pending[0]).catch(e => ({ error: e, net: true }));
      if (r && r.error) {
        const e = r.error, code = String(e.code || '');
        lastErr = (code ? code + ' ' : '') + (e.message || String(e));
        console.warn('评审记录写入云端失败', e);
        // 数据库明确拒绝（如重复、权限）：重试也不会成功，丢弃这一条，避免卡住后面的操作
        if (!r.net && /^[0-9A-Z]{5}$/.test(code)) { pending.shift(); jset(PK, pending); continue; }
        mode = 'error'; return false;
      }
      pending.shift(); jset(PK, pending);
    }
    return true;
  }
  async function pull() {
    if (!db) return;
    const [a, b, c] = await Promise.all([
      db.from('weapon_status').select('*'),
      db.from('weapon_notes').select('*').order('created_at', { ascending: true }),
      db.from('weapon_scores').select('*'),
    ]).catch(e => [{ error: e }, { error: e }, { error: e }]);
    if (a.error || b.error || c.error) { const e = a.error || b.error || c.error; lastErr = (e.code ? e.code + ' ' : '') + (e.message || String(e)); console.warn('读取云端评审记录失败', e); mode = 'error'; return; }
    if (pending.length) return;   // 拉取期间又有新操作：先不覆盖，下一轮再拉
    const next = {}, get = id => next[id] || (next[id] = { status: '', at: 0, notes: [], scores: {} });
    (a.data || []).forEach(r => { const o = get(r.item_id); o.status = ST[r.status] ? r.status : ''; o.at = +r.updated_at || 0; });
    (b.data || []).forEach(r => { get(r.item_id).notes.push({ id: r.id, text: r.body, at: +r.created_at || 0 }); });
    (c.data || []).forEach(r => { get(r.item_id).scores[r.voter] = { fun: +r.fun || 0, clear: +r.clear || 0, cost: +r.cost || 0, at: +r.updated_at || 0 }; });
    items = next; mode = 'cloud'; lastErr = ''; syncedAt = Date.now(); jset(CK, items);
  }
  async function sync() {
    if (!db || busy) return;
    busy = true;
    try { if (await flush()) await pull(); } finally { busy = false; notify(); }
  }
  function commit(op) {
    pending.push(op); jset(PK, pending); jset(CK, items); notify();
    if (db) sync(); else { pending = []; jset(PK, pending); }
  }

  function setStatus(id, s) {
    if (s && !ST[s]) return;
    const r = rec(id); r.status = r.status === s ? '' : s; r.at = Date.now();
    commit({ t: 'status', id, status: r.status, at: r.at });
  }
  function addNote(id, text) {
    text = String(text || '').trim(); if (!text) return false;
    const note = { id: uid(), text: text.slice(0, 2000), at: Date.now() };
    rec(id).notes.push(note);
    commit({ t: 'add', id, note }); return true;
  }
  function delNote(id, nid) { const r = rec(id); r.notes = r.notes.filter(n => n.id !== nid); commit({ t: 'del', id, nid }); }
  const myScore = id => Object.assign({ fun: 0, clear: 0, cost: 0 }, (rec(id).scores || {})[VOTER] || {});
  function setScore(id, key, val) {
    if (!['fun', 'clear', 'cost'].includes(key)) return;
    const r = rec(id), cur = myScore(id);
    cur[key] = cur[key] === val ? 0 : val; cur.at = Date.now();
    r.scores[VOTER] = { fun: cur.fun, clear: cur.clear, cost: cur.cost, at: cur.at };
    commit({ t: 'score', id, voter: VOTER, fun: cur.fun, clear: cur.clear, cost: cur.cost, at: cur.at });
  }
  function avgScore(id) {
    const arr = Object.values(rec(id).scores || {}).filter(s => s.fun || s.clear || s.cost);
    const avg = k => { const v = arr.map(s => s[k]).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
    return { n: arr.length, fun: avg('fun'), clear: avg('clear'), cost: avg('cost') };
  }
  function importData(inc) {
    const src = inc && inc.items && typeof inc.items === 'object' ? inc.items : inc;
    if (!src || typeof src !== 'object') throw new Error('不是有效的评审记录文件');
    let n = 0;
    for (const [id, r] of Object.entries(src)) {
      if (!r || typeof r !== 'object') continue;
      const cur = rec(id);
      if (ST[r.status] && (+r.at || 0) > (cur.at || 0)) { cur.status = r.status; cur.at = +r.at || Date.now(); pending.push({ t: 'status', id, status: cur.status, at: cur.at }); n++; }
      const have = new Set(cur.notes.map(x => x.id));
      (Array.isArray(r.notes) ? r.notes : []).forEach(x => {
        if (!x || !x.text || have.has(String(x.id))) return;
        const note = { id: String(x.id || uid()), text: String(x.text).slice(0, 2000), at: +x.at || Date.now() };
        cur.notes.push(note); pending.push({ t: 'add', id, note }); n++;
      });
      cur.notes.sort((a, b) => a.at - b.at);
      if (r.scores && typeof r.scores === 'object') Object.entries(r.scores).forEach(([voter, s]) => {
        if (!s || voter === VOTER) return;
        const old = cur.scores[voter];
        if (!old || (+s.at || 0) > (old.at || 0)) { cur.scores[voter] = { fun: +s.fun || 0, clear: +s.clear || 0, cost: +s.cost || 0, at: +s.at || Date.now() }; pending.push({ t: 'score', id, voter, fun: cur.scores[voter].fun, clear: cur.scores[voter].clear, cost: cur.scores[voter].cost, at: cur.scores[voter].at }); n++; }
      });
    }
    jset(PK, pending); jset(CK, items); notify();
    if (db) sync(); else { pending = []; jset(PK, pending); }
    return n;
  }

  window.RV = {
    ST,
    get: id => { const r = items[id]; return r ? Object.assign({ status: '', at: 0, notes: [], scores: {} }, r) : { status: '', at: 0, notes: [], scores: {} }; },
    all: () => items,
    setStatus, addNote, delNote, setScore, myScore, avgScore, sync, importData,
    lastError: () => lastErr,
    mode: () => mode, pendingCount: () => pending.length, syncedAt: () => syncedAt,
    onChange: f => subs.push(f),
  };
  if (db) {
    sync();
    setInterval(() => { if (!document.hidden) sync(); }, 8000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  }
})();

</script>
<script>
(function () {
  const W = window.WP, CATS = window.CATS, TIERS = window.TIERS, QN = window.QN, SK = window.SK, MONS = window.MONS, NUM = window.NUM;

  const CK = ['melee', 'ranged'];
  const AX = [['输出', '#E8643C'], ['控场', '#2A9E86'], ['爽感', '#8E6BF0']];

  const tierTag = t => `<span class="tag" style="background:${TIERS[t].color}">${TIERS[t].name}</span>`;

  const bars = sc => `<div class="bars">${AX.map(([n, c], i) => `<div><b style="color:${c};font-weight:700">${n}</b><span><i style="width:${sc[i] * 20}%;background:${c}"></i></span></div>`).join('')}</div>`;
  const secH = (n, t, d, id) => `<div class="sec-h" ${id ? `id="${id}"` : ''}><span class="idx">${n}</span><h2>${t}</h2>${d ? `<p>${d}</p>` : ''}</div>`;

  /* ---------------- 导航 ---------------- */

    { g: '评审', c: '#C23B6E', items: [['review', '评审汇总', '★']] },
    { g: '总览', items: [['overview', '设计总览', '01'], ['rules', '通用规则', '02'], ['monsters', '怪物克制', '03'], ['numbers', '数值总表', '04']] },
    ...SLOTS.map(s => ({ g: `${CATS[s.cat].name} · ${TIERS[s.tier].name}`, c: s.cat === 'melee' ? CATS.melee.color : CATS.ranged.color, items: s.items.map(i => [i.id, i.name]) })),
    { g: '落地', items: [['balance', '投放与排期', '05'], ['todo', '待确认', '06']] },

  function nav(cur) {

    document.getElementById('nav').innerHTML = PAGES_F().map(g => `<div class="ng">${g.c ? `<i style="background:${g.c}"></i>` : ''}${g.g}</div>` +
      g.items.map(([id, name, num]) => `<a class="nl ${id === cur ? 'on' : ''}" href="#${id}" ${id === cur ? 'aria-current="page"' : ''}>${num ? `<span class="num">${num}</span>` : `<img src="${icon(id)}" alt="">`}${name}${byId[id] ? rvDot(id) : ''}</a>`).join('')).join('');
    const on = document.querySelector('.nl.on');
    if (on && window.innerWidth <= 860) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  /* ---------------- 总览 ---------------- */
  function tierRhythm() {
    const Wd = 900, x0 = 150, x1 = 800, X = t => x0 + (x1 - x0) * t / 6;
    const rows = [
      [1, '一下一下', '点按 / 拉弓，每一下都是一次手动操作', [[0.8, 0.25], [2.6, 0.25], [4.4, 0.25]], null],
      [2, '连招 + 机制', '三连发 / 三段斩 / 穿透 / 反弹，带状态', [[0.6, 0.18], [0.9, 0.18], [1.2, 0.18], [3.3, 0.18], [3.6, 0.18], [3.9, 0.18]], '★'],
      [3, '按住 / 放置 / 空袭', '持续输出或大范围，过热 / 冷却 / 笨重是代价', [], 'long'],
    ];
    const H = 70, svg = rows.map(([t, a, b, pulses, extra], i) => {
      const y = 36 + i * 104, c = TIERS[t].color;
      let s = `<text x="20" y="${y + 6}" font-family="ZCOOL KuaiLe" font-size="20" fill="${c}">${TIERS[t].name}</text><text x="20" y="${y + 26}" font-size="11" fill="#776656" font-family="Noto Sans SC">${TIERS[t].q}</text>`;
      s += `<rect x="${x0}" y="${y - 14}" width="${x1 - x0}" height="40" rx="10" fill="#FBF6EC" stroke="#E3D5C0"/>`;

      s += `<text x="${x1 + 14}" y="${y - 2}" font-size="13" font-weight="700" fill="#2C241E" font-family="Noto Sans SC">${a}</text><text x="${x1 + 14}" y="${y + 16}" font-size="11" fill="#776656" font-family="Noto Sans SC">${t === 1 ? 'DPS 8–29' : t === 2 ? 'DPS 25–50' : 'DPS 61–76 + AoE'}</text>`;
      return s;
    }).join('');
    return `<svg viewBox="0 0 ${Wd} 330" role="img" aria-label="三个品阶的出手节奏对比（6 秒时间轴）">${svg}
      <path d="M${x0} 300 H${x1}" stroke="#A8988A"/>${[0, 1, 2, 3, 4, 5, 6].map(t => `<text x="${X(t)}" y="320" text-anchor="middle" font-size="11" fill="#776656" font-family="Noto Sans SC">${t}s</text>`).join('')}</svg>`;
  }
  function scatter() {
    const X = v => 60 + (v - 1) * 120, Y = v => 330 - (v - 1) * 65;
    const pts = W.map((w, i) => ({ w, x: X(w.score[0]) + Math.cos(i * 2.4) * 9, y: Y(w.score[1]) + Math.sin(i * 2.4) * 9, ox: X(w.score[0]), oy: Y(w.score[1]) }));
    for (let n = 0; n < 400; n++) {
      for (const a of pts) for (const b of pts) {
        if (a === b) continue; const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 0.5;
        if (d < 58) { const f = (58 - d) / 8 / d; a.x += dx * f; a.y += dy * f; }
      }
      for (const a of pts) { a.x += (a.ox - a.x) * 0.012; a.y += (a.oy - a.y) * 0.012; a.x = Math.min(528, Math.max(72, a.x)); a.y = Math.min(300, Math.max(54, a.y)); }
    }
    return `<svg viewBox="0 0 600 400" role="img" aria-label="武器定位：输出与控场">
      <rect x="60" y="30" width="480" height="300" fill="#FBF6EC" stroke="#E3D5C0"/>
      <rect x="300" y="30" width="240" height="150" fill="#E8643C" opacity=".07"/><text x="530" y="52" text-anchor="end" font-family="ZCOOL KuaiLe" font-size="16" fill="#E8643C">又打又控</text>
      <rect x="60" y="180" width="240" height="150" fill="#2A9E86" opacity=".05"/>
      <text x="300" y="372" text-anchor="middle" font-size="13" fill="#776656" font-family="Noto Sans SC">输出 →</text>
      <text x="22" y="180" text-anchor="middle" font-size="13" fill="#776656" font-family="Noto Sans SC" transform="rotate(-90 22 180)">控场 / 保命 →</text>
      ${[1, 2, 3, 4, 5].map(v => `<text x="${X(v)}" y="348" text-anchor="middle" font-size="11" fill="#A8988A" font-family="Noto Sans SC">${v}</text><text x="48" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#A8988A" font-family="Noto Sans SC">${v}</text>`).join('')}
      ${pts.map(({ w, x, y }) => `<a href="#${w.id}"><g transform="translate(${x.toFixed(0)},${y.toFixed(0)})"><circle r="18" fill="#F4EBDD" stroke="${CATS[w.cat].color}" stroke-width="${w.tier === 3 ? 4 : w.tier === 2 ? 3 : 2}"/><image href="${icon(w.id)}" x="-15" y="-15" width="30" height="30" clip-path="circle(14px)"/><text y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#2C241E" font-family="Noto Sans SC" paint-order="stroke" stroke="#FBF6EC" stroke-width="3">${w.name.slice(0, 5)}</text></g></a>`).join('')}
      <g font-size="11" font-family="Noto Sans SC" fill="#776656"><circle cx="360" cy="388" r="5" fill="none" stroke="${CATS.melee.color}" stroke-width="3"/><text x="370" y="392">近战</text><circle cx="420" cy="388" r="5" fill="none" stroke="${CATS.ranged.color}" stroke-width="3"/><text x="430" y="392">远程</text><text x="480" y="392">圈越粗 = 品阶越高</text></g>
    </svg>`;
  }
  const CEHREF = { '@numbers': ['numbers', '数值总表'], '@rules': ['rules', '通用规则'], '@monsters': ['monsters', '怪物克制'] };
  const chipOf = id => CEHREF[id] ? `<a class="mchip" href="#${CEHREF[id][0]}">${CEHREF[id][1]}</a>` : wchip(id);

  const wcard = w => `<a class="card wcard" href="#${w.id}" style="--c:${CATS[w.cat].color}"><span data-rvbadge="${w.id}" class="rvb-abs">${rvBadge(w.id)}</span><img src="${icon(w.id)}" alt="${w.toyName}"><div><h3>${w.name}${recTag(w.id)}</h3><div class="rstags">${qChip(w)}<span class="chip"><b>占格</b>${w.meta.size}</span></div><p>${w.pitch}</p></div></a>`;
  function overview(tab) {
    tab = tab === 'all' ? 'all' : tab === 'alt' ? 'alt' : 'principle';

    const head = `<section class="hero"><img src="${IM('img/hero.webp')}" alt="夜晚教室里，玩具们拿着武器对抗怪物">

          <h1>不靠蛮力，<br>靠玩具。</h1>
          <p>队伍之间不能 PK，武器只对付怪物。近战 / 远程各 3 个品阶、每个品阶 3 把备选，共 ${W.length} 把：低阶一下一下打，中阶带机关，高阶按住就能喷火、扫射、空袭。全部复用物品表里已有的武器与玩具模型。</p>
          <div class="hero-pills"><span>6 人 · 2×3 小队</span><span>武器栏 2 格</span><span>只打怪物</span><span>0 个新模型</span></div>

      <div class="otabs" role="tablist"><a role="tab" href="#overview" class="${tab === 'principle' ? 'on' : ''}" aria-selected="${tab === 'principle'}">设计原则</a><a role="tab" href="#all" class="${tab === 'all' ? 'on' : ''}" aria-selected="${tab === 'all'}">武器总览 · ${W.length}</a><a role="tab" href="#alt" class="${tab === 'alt' ? 'on' : ''}" aria-selected="${tab === 'alt'}">备选池 · ${window.POOL.length + window.POOL_NEW.length}</a></div>`;

    const principle = `
      <section class="sec">${secH('1', '三个设计目标', '每把武器至少命中一个，最好命中两个')}
        <div class="grid g3">
          <div class="card pillar"><i class="bar" style="background:#E8643C"></i><div class="big" style="color:#E8643C">品阶拉开</div><p class="muted small">三个品阶玩起来要像三类武器</p>
            <ul><li>低阶：点按 / 拉弓，一下一下打</li><li>中阶：连招、反弹、穿透、诱饵，带机制</li><li>高阶：按住 / 放置 / 空袭，持续或大范围</li></ul></div>
          <div class="card pillar"><i class="bar" style="background:#2A9E86"></i><div class="big" style="color:#2A9E86">弱强绑定</div><p class="muted small">武器和怪物互相成就</p>
            <ul><li>每把至少有一只“最佳对手”</li><li>克制关系写进怪物克制矩阵</li><li>错的武器也能打，只是更慢</li></ul></div>
          <div class="card pillar"><i class="bar" style="background:#8E6BF0"></i><div class="big" style="color:#8E6BF0">好看好笑</div><p class="muted small">丰富“忍不住截图”的瞬间</p>
            <ul><li>玩具化受击：棉花 / 纸片 / 零件，不见血</li><li>高阶都有名场面：喷火、弹幕、空袭、合体</li><li>不留尸体、不留地面液体（合规红线）</li></ul></div>
        </div></section>

      <section class="sec">${secH('2', '挑选标准', '尽量复用，已被确认做成功能战利品的玩具不再占用')}
        <div class="grid g4">
          <div class="card fun"><div class="n">01</div><h3>复用现有资源</h3><p>${W.length} 把全部来自物品表现有模型：${wp} 把本身就是物品表里的武器，${toy} 把是玩具借用。</p></div>
          <div class="card fun"><div class="n">02</div><h3>避开功能战利品</h3><p>弹簧拳套、竹蜻蜓、魔法仙女棒、苍蝇拍、泡泡棒、跳跳杆、直升机等已定为功能战利品，不用。</p></div>
          <div class="card fun"><div class="n">03</div><h3>一眼看懂</h3><p>外形就能猜到用法：菜刀 = 劈，水枪 = 喷，锤子 = 砸，哥斯拉 = 喷火。</p></div>
          <div class="card fun"><div class="n">04</div><h3>有取舍</h3><p>越强越要付出代价：占格更大、会过热、有冷却、会翻车。</p></div>
        </div></section>

      <section class="sec">${secH('3', '基本约定')}
        <div class="grid g2" style="align-items:start">
          <div class="card"><ul class="list">
            <li>武器放在<b>武器栏</b>（2 格，按 品质 → 价值 自动填充），攻击键出手；没有武器时是拳头（DPS 12，作为基准）。</li>
            <li>每把武器<b>只有一个固定品质</b>，强度已按品质倍率算好（伤害、耐久）；特殊效果数值固定，不随品质变化。</li>
            <li>耐久型：每次攻击 −1；<b>高阶按时间扣</b>（0.25–1 秒一格），耐久归零变纯战利品（价值 30%）。</li>
            <li>占格随品阶变大：低阶 1×1–2×2，中阶 1×1–2×3，高阶最大 3×3，背包空间是代价之一。</li></ul></div>
          <div class="note warn"><b>底线：</b>武器只对怪物生效。对玩家（含队友、对手）不造成伤害、不击退，不改变“队伍之间不能 PK、只竞争资源”的规则；怪物受击是玩具化表现，不留尸体与液体。</div>

  /* ---------------- 数值总表 ---------------- */
  function dpsChart() {
    const arr = W.filter(w => NUM[w.id].dps > 0).slice().sort((a, b) => NUM[a.id].dps - NUM[b.id].dps), mx = 80;
    const rowH = 26, H = arr.length * rowH + 40;
    return `<svg viewBox="0 0 640 ${H}" role="img" aria-label="单体理论 DPS 对比">
      <line x1="168" y1="14" x2="168" y2="${H - 22}" stroke="#E3D5C0"/>
      <line x1="${168 + 12 / mx * 420}" y1="10" x2="${168 + 12 / mx * 420}" y2="${H - 22}" stroke="#A8988A" stroke-dasharray="4 4"/><text x="${168 + 12 / mx * 420}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#776656" font-family="Noto Sans SC">拳头 12</text>
      ${arr.map((w, i) => `<g transform="translate(0,${14 + i * rowH})"><image href="${icon(w.id)}" x="6" y="-3" width="22" height="22"/><text x="34" y="13" font-size="12" font-family="Noto Sans SC" fill="#2C241E">${w.name}</text><rect x="168" y="1" width="${NUM[w.id].dps / mx * 420}" height="16" rx="5" fill="${TIERS[w.tier].color}"/><text x="${174 + NUM[w.id].dps / mx * 420}" y="13" font-size="11" font-family="Noto Sans SC" fill="#2C241E">${NUM[w.id].dps}</text></g>`).join('')}
    </svg>`;
  }
  function numbers() {

    const ttkSec = d => d === 12 ? '≈ 8.3s' : d === '8 – 29' ? '3.4 – 12s' : d === '25 – 50' ? '2 – 4s' : '1.3 – 1.6s（AoE）';
    return `<div class="page">
      <p class="eyebrow">04 · 数值总表</p><h1>武器数值统一表（草案）</h1>
      <p class="muted" style="margin-top:8px;max-width:780px">对应怪物清单 REQ-01「武器数值统一梳理」（伤害 / 攻速 / 特殊）。以下数值已含品质倍率，供评审和后续与怪物血量联动；<b>怪物血量未定，本表以“小怪 HP 100（占位）、拳头 DPS 12”估算。</b></p>

      <section class="sec">${secH('1', '全部武器', '按槽位排列；理论 DPS = 一个完整出手周期的单体伤害 / 周期')}
        <div class="tscroll"><table class="tbl numt"><thead><tr><th>武器</th><th>品阶</th><th>品质</th><th>单次伤害</th><th>出手节奏</th><th>理论 DPS</th><th>范围 / 射程</th><th>耐久</th><th>占格</th><th>特殊</th></tr></thead><tbody>
        ${SLOTS.map(s => `<tr class="grp"><td colspan="10" style="background:${CATS[s.cat].color}14;color:${CATS[s.cat].color}">${CATS[s.cat].name} · ${TIERS[s.tier].name}</td></tr>` + s.items.map(w => { const n = NUM[w.id]; return `<tr><td>${wchip(w.id)}</td><td>${tierTag(w.tier)}</td><td>${qChip(w)}</td><td>${n.dmg}</td><td>${n.rhythm}</td><td><b>${n.dps || '爆发 205'}</b></td><td>${n.rng}</td><td>${n.dur}</td><td>${w.meta.size}</td><td style="text-align:left">${n.spec}</td></tr>`; }).join('')).join('')}

      </section>

      <section class="sec">${secH('2', 'DPS 对比', '虚线是拳头基准；空袭飞机为一次性爆发（205），不在图内')}

      </section>

      <section class="sec">${secH('3', '估算击杀时间', '基准小怪 HP 100（占位），不计命中率与走位')}
        <div class="grid g4">${ttk.map(([t, d, c]) => `<div class="card fun" style="--c:${c}"><div class="n">${ttkSec(d)}</div><h3>${t}</h3><p>理论 DPS ${d}</p></div>`).join('')}</div>
        <div class="note" style="margin-top:14px">精英（★★★）与 Boss（★★★★★）的血量由怪物侧另定；按“低阶打小怪、中阶打精英、高阶打 Boss / 多怪”的方向，血量建议 ≈ 小怪的 3 倍 / 10 倍以上，请在 REQ-01 一起定。</div>
      </section>

      <section class="sec">${secH('4', '换算与约束')}
        <div class="grid g2" style="align-items:start">
          <div class="card"><h3 style="margin-bottom:8px">品质倍率</h3><ul class="list"><li>白 ×1 · 绿 ×1.12 · 蓝 ×1.25 · 紫 ×1.4 · 金 ×1.6 · 红 ×1.85（沿用物品系统，作用于伤害与耐久）。</li><li>本表“单次伤害 / 耐久”已乘倍率并取整。</li></ul></div>
          <div class="card"><h3 style="margin-bottom:8px">特殊效果不随品质</h3><ul class="list"><li>减速 −35%、眩晕 2s、击退 2.5m 等按武器固定，避免同一把武器换颜色后玩法变化。</li><li>同品质内以“机制差异”拉开，不靠堆数值。</li></ul></div>
        </div>
      </section>
    </div>`;
  }

  /* ---------------- 单品 ---------------- */
  function flow(arr) {
    return `<div class="flow">${arr.map(s => typeof s === 'string' ? `<div class="fstep">${s}</div>` :
      `<div class="fdec"><div class="fq">${s.q}</div><div class="fbr">${s.branches.map(([lab, steps]) => `<div class="fcol"><span class="flabel">${lab}</span>${flow(steps)}</div>`).join('')}</div></div>`).join('')}</div>`;
  }
  const REQC = { 程序: '#2A9E86', 美术: '#E7A21E', 动效: '#7E5CE6', 音效: '#4F9BEA', UI: '#F06A47', 关卡: '#776656' };
  const combosOf = id => (window.COMBOS || []).filter(c => c[0] === id || c[1] === id);
  function comboCards(w) {
    return `<div class="grid g2">${combosOf(w.id).map(([a, b, t, d, lab]) => {
      const other = a === w.id ? b : a;
      const pair = `<img src="${icon(w.id)}" alt="${w.name}"><b>+</b>${other ? `<a href="#${other}" title="${byId[other].name}"><img src="${icon(other)}" alt="${byId[other].name}"></a>` : `<span class="chip">${lab || ''}</span>`}`;
      return `<div class="card combo"><div class="pair">${pair}</div><div><h3>${t}${other ? ` <small>＋ ${byId[other].name}</small>` : ''}</h3><p>${d}</p></div></div>`;
    }).join('')}</div>`;
  }
  function item(w) {
    const c = CATS[w.cat].color, m = w.meta, sl = slotOf(w);
    const idx = W.indexOf(w), prev = W[(idx + W.length - 1) % W.length], next = W[(idx + 1) % W.length];
    const sceneSpec = Object.assign({ w: 640, h: 280 }, w.scene);
    const hasCombo = combosOf(w.id).length > 0;
    let n = 0; const N = () => String(++n);
    const sub = [['show', '游戏表现'], ['scn', '使用场景'], ['fun', '有趣在哪'], ['flow', '使用流程'], ...(hasCombo ? [['combo', '组合技']] : []), ['param', '数值'], ['rule', '规则与怪物'], ['req', '制作需求']];
    return `<div class="page" style="--c:${c}">
      <header class="ihead"><div><img class="pic" src="${icon(w.id)}" alt="${w.name}图标">${w.id === 'cleaver' ? '<p class="picnote">示意图</p>' : ''}</div>
        <div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${catTag(w.cat)}${tierTag(w.tier)}${qChip(w)}${oriTag(w)}${recTag(w.id)}<span class="eyebrow">武器 ${String(idx + 1).padStart(2, '0')} / ${W.length}</span></div>
          <h1 style="margin-top:6px">${w.name}<small>${w.en}</small></h1>
          <p class="pitch">${w.pitch}</p>
          <div class="chips"><span class="chip"><b>占格</b>${m.size}</span><span class="chip"><b>出手</b>${m.cast}</span><span class="chip"><b>耐久</b>${m.res}</span><span class="chip"><b>节奏</b>${m.cd}</span><span class="chip"><b>对象</b>${m.target}</span></div>
          ${bars(w.score)}
        </div></header>
      <div class="slotbar" style="--c:${TIERS[w.tier].color}"><span class="sb-l">本槽位 · ${CATS[w.cat].name}${TIERS[w.tier].name}（${TIERS[w.tier].q}）· 3 选 1</span>${sl.items.map(x => `<a class="mchip${x.id === w.id ? ' cur' : ''}" href="#${x.id}"><img src="${icon(x.id)}" alt="">${x.name}${rvDot(x.id)}</a>`).join('')}</div>
      <div style="margin-top:14px">${rvCard(w)}</div>
      <nav class="subnav" aria-label="本页目录">${sub.map(([k, t]) => `<a href="#${w.id}/${k}">${t}</a>`).join('')}</nav>

      <section class="sec" style="margin-top:18px">${secH(N(), '游戏表现', '循环动画草图 · 侧视角示意', 'show')}
        <div class="stage" id="stage">${SK.render(sceneSpec)}
          <div class="stage-bar"><span class="lv"><i></i>草图动画 · ${sceneSpec.dur}s 循环 · 绿圈 = 你　灰紫 = 怪物</span><div class="btns"><button type="button" data-act="pause">暂停</button><button type="button" data-act="replay">重播</button></div></div></div>
        <div class="boards">${w.boards.map(([t, cap], i) => `<figure class="board" style="margin:0">${SK.render(Object.assign({}, sceneSpec, { beam: false }), { at: t })}<p><b>${i + 1}</b><span>${cap}</span></p></figure>`).join('')}</div>
      </section>

      <section class="sec">${secH(N(), '使用场景', '', 'scn')}
        <div class="grid g3">${w.scenarios.map(([t, d, els]) => `<div class="card scn">${SK.render({ w: 320, h: 210, els, beam: false })}<h3>${t}</h3><p>${d}</p></div>`).join('')}</div>
      </section>

      <section class="sec">${secH(N(), '有趣在哪', '', 'fun')}
        <div class="grid g3">${w.fun.map(([t, d], i) => `<div class="card fun"><div class="n">0${i + 1}</div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>
      </section>

      <section class="sec">${secH(N(), '使用流程', '', 'flow')}
        <div class="card" style="padding:22px 18px">${flow(w.flow)}</div>
      </section>

      ${hasCombo ? `<section class="sec">${secH(N(), '组合技', '和其他武器 / 功能战利品一起用', 'combo')}${comboCards(w)}</section>` : ''}

      <section class="sec">${secH(N(), '数值', `品质固定为 ${qChip(w)}，数值已含品质倍率；完整对比见 <a href="#numbers">数值总表</a>`, 'param')}
        <div class="tscroll"><table class="tbl ptbl"><thead><tr><th>参数</th><th>数值</th></tr></thead><tbody>${w.params.rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>
      </section>

      <section class="sec">${secH(N(), '规则与怪物', '', 'rule')}
        <div class="grid g2" style="align-items:start"><div class="card"><h3 style="margin-bottom:10px">规则边界</h3><ul class="list">${w.rules.map(r => `<li>${r}</li>`).join('')}</ul></div>
        <div class="card"><h3 style="margin-bottom:10px">对 5 只怪的效果</h3><div class="monlist">${w.mon.map(([mn, note, r]) => `<div class="mrow">${rt(r)}<div><b>${mn}</b><p>${note}</p></div></div>`).join('')}</div></div></div>
      </section>

      <section class="sec">${secH(N(), '制作需求', '', 'req')}
        <div class="grid g3">${Object.entries(w.req).map(([k, v]) => `<div class="card req" style="--c:${REQC[k]}"><h3><i></i>${k}</h3><ul>${v.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>

      <nav class="pn" aria-label="上一把与下一把"><a class="card" href="#${prev.id}"><img src="${icon(prev.id)}" alt=""><span><small>上一把</small>${prev.name}</span></a><a class="card" href="#${next.id}"><span><small>下一把</small>${next.name}</span><img src="${icon(next.id)}" alt=""></a></nav>
    </div>`;
  }

      [20, 360, 860, 90, '操场 · 沙坑 · 花坛', ['bounce', 'board']],

    return `<svg viewBox="0 0 900 470" role="img" aria-label="学校地图投放示意">
      <rect width="900" height="470" rx="18" fill="#FBF6EC"/>

      ${rooms.map(([x, y, w, h, n, ids]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${n === '校长室' || n === '规则宝箱' ? '#F7E3D8' : '#fff'}" stroke="#2C241E" stroke-width="1.6" ${n === '校长室' || n === '规则宝箱' ? 'stroke-dasharray="6 4"' : ''}/>
        <text x="${x + 12}" y="${y + 24}" font-size="13" font-weight="700" font-family="Noto Sans SC" fill="#2C241E">${n}${n === '校长室' ? '（上锁）' : ''}</text>
        ${ids.map((id, j) => `<a href="#${id}"><image href="${icon(id)}" x="${x + w / 2 - ids.length * 24 + j * 48 + 2}" y="${y + h / 2 - 14}" width="44" height="44"/></a>`).join('')}`).join('')}
    </svg>`;
  }
  function prioChart() {
    const X = v => 60 + (v - 1) * 120, Y = v => 330 - (v - 3) * 140;
    return `<svg viewBox="0 0 580 380" role="img" aria-label="开发成本与乐趣分布">
      <rect x="60" y="40" width="480" height="290" fill="#FBF6EC" stroke="#E3D5C0"/>
      <rect x="60" y="40" width="240" height="145" fill="#D7EEE6" opacity=".7"/><text x="70" y="62" font-family="ZCOOL KuaiLe" font-size="16" fill="#1D7A66">先做：好玩又便宜</text>
      <text x="300" y="368" text-anchor="middle" font-size="13" fill="#776656" font-family="Noto Sans SC">开发成本 →</text>
      <text x="22" y="185" text-anchor="middle" font-size="13" fill="#776656" font-family="Noto Sans SC" transform="rotate(-90 22 185)">乐趣 / 传播 →</text>
      ${(() => { const P = W.map((w, i) => { const [cst, fn] = window.PRIO[w.id]; return { w, x: X(cst) + Math.cos(i * 2.4) * 9, y: Y(fn) + Math.sin(i * 2.4) * 9, ox: X(cst), oy: Y(fn) }; });
        for (let n = 0; n < 500; n++) { for (const a of P) for (const b of P) { if (a === b) continue; const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || .5; if (d < 52) { const f = (52 - d) / 8 / d; a.x += dx * f; a.y += dy * f; } } for (const a of P) { a.x += (a.ox - a.x) * .01; a.y += (a.oy - a.y) * .01; a.x = Math.min(522, Math.max(80, a.x)); a.y = Math.min(300, Math.max(66, a.y)); } }
        P.forEach(p => { p.w.__px = p.x; p.w.__py = p.y; }); return ''; })()}
      ${W.map(w => { return `<a href="#${w.id}"><g transform="translate(${w.__px.toFixed(0)},${w.__py.toFixed(0)})"><circle r="16" fill="#F4EBDD" stroke="${CATS[w.cat].color}" stroke-width="2.5"/><image href="${icon(w.id)}" x="-14" y="-14" width="28" height="28" clip-path="circle(13px)"/><text y="28" text-anchor="middle" font-size="10" font-weight="700" font-family="Noto Sans SC" fill="#2C241E" paint-order="stroke" stroke="#FBF6EC" stroke-width="3">${w.name.slice(0, 5)}</text></g></a>`; }).join('')}
    </svg>`;
  }

        </div></div>
      </section>
    </div>`;
  }
  function todo() {
    return `<div class="page"><p class="eyebrow">06 · 待确认</p><h1>需要一起拍板的问题</h1>
      <ul class="list todo" style="margin-top:24px">${window.TODOS.map(([a, b], i) => `<li><span class="qn">${String(i + 1).padStart(2, '0')}</span><span><b>${a}</b><small>${b}</small></span></li>`).join('')}</ul></div>`;
  }

  const view = document.getElementById('view');
  /* ---------------- 评审 ---------------- */
  const RV = window.RV, RVS = ['adopt', 'defer', 'drop'];
  const rvName = s => s ? RV.ST[s].name : '未评审';
  const rvColor = s => s ? RV.ST[s].color : '#D9CFC2';
  const p2 = n => String(n).padStart(2, '0');
  const fmtT = t => { if (!t) return ''; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const rvDot = id => `<i class="rvdot" style="background:${rvColor(RV.get(id).status)}" title="评审：${rvName(RV.get(id).status)}"></i>`;
  const rvBadge = id => { const s = RV.get(id).status; return s ? `<span class="rvbadge" style="background:${rvColor(s)}">${rvName(s)}</span>` : ''; };
  function rvBtns(id) {
    const cur = RV.get(id).status;
    return RVS.map(s => `<button type="button" class="rvb${cur === s ? ' on' : ''}" style="--c:${RV.ST[s].color}" data-rv="${s}" data-id="${id}" title="${RV.ST[s].tip}" aria-pressed="${cur === s}">${RV.ST[s].name}</button>`).join('');
  }
  function rvNotes(id) {
    const r = RV.get(id);
    return r.notes.length ? r.notes.map(n => `<div class="rvnote"><time>${fmtT(n.at)}</time><button type="button" data-rvdel="${n.id}" data-id="${id}" title="删除这条意见" aria-label="删除这条意见">×</button><div class="tx">${esc(n.text).replace(/\n/g, '<br>')}</div></div>`).join('') : '';
  }
  const SC = [['fun', '好玩度', '打起来爽不爽、有没有名场面'], ['clear', '好懂度', '一眼能不能看懂怎么用'], ['cost', '好做度', '开发成本低 = 5 分']];
  function rvScores(id) {
    const my = RV.myScore(id), av = RV.avgScore(id);
    return `<div class="scr">${SC.map(([k, t, tip]) => `<div class="scrow" title="${tip}"><span class="sl">${t}</span><span class="sbtn">${[1, 2, 3, 4, 5].map(v => `<button type="button" class="sb${my[k] === v ? ' on' : ''}" data-sc="${k}" data-v="${v}" data-id="${id}" aria-pressed="${my[k] === v}">${v}</button>`).join('')}</span><span class="sav">${av.n ? `${av[k] ? av[k].toFixed(1) : '—'} <small>/ ${av.n} 人</small>` : '<small>暂无</small>'}</span></div>`).join('')}</div>`;
  }
  function rvCard(w) {
    return `<section class="card rvcard" id="rv" data-id="${w.id}">
      <div class="rvrow"><h3>评审</h3><div class="rvbtns" data-rvbtns="${w.id}">${rvBtns(w.id)}</div><span class="rvsave small"></span></div>
      <div class="rvhelp small muted">采纳 = 入选该槽位，CE2.0 制作 · 延后 = 备用，排到之后 · 摒弃 = 落选</div>
      ${RV.mode() === 'local' ? `<p class="rvlocal">⚠ 这是本地预览，评审记录不会上云。${window.CLOUD_CFG && window.CLOUD_CFG.shareUrl ? `会上请用 <a href="${window.CLOUD_CFG.shareUrl}" target="_blank" rel="noopener">在线版</a> 记录，所有人共用、自动保存。` : ''}</p>` : ''}
      <div class="rvsc"><h4>打个分 <small>每人一份，匿名，取平均</small></h4><div data-rvscores="${w.id}">${rvScores(w.id)}</div></div>
      <form class="rvform" data-id="${w.id}" autocomplete="off"><textarea name="text" rows="4" maxlength="2000" placeholder="记录评审意见…（Ctrl + Enter 提交）" aria-label="评审意见"></textarea><button type="submit">记录</button></form>
      <div class="rvnotes" data-rvnotes="${w.id}">${rvNotes(w.id)}</div>
    </section>`;
  }
  function rvCount() { const c = { adopt: 0, defer: 0, drop: 0, '': 0 }; W.forEach(it => c[RV.get(it.id).status || '']++); return c; }

  let rvFilter = 'all';
  const FILTERS = [['all', '全部'], ['none', '未评审'], ['adopt', '采纳'], ['defer', '延后'], ['drop', '摒弃']];
  const rvMatch = it => { const s = RV.get(it.id).status; return rvFilter === 'all' || (rvFilter === 'none' ? !s : s === rvFilter); };
  const avgTxt = id => { const a = RV.avgScore(id); return a.n ? `<span class="avg">好玩 ${a.fun ? a.fun.toFixed(1) : '—'} · 好懂 ${a.clear ? a.clear.toFixed(1) : '—'} · 好做 ${a.cost ? a.cost.toFixed(1) : '—'}<small> · ${a.n} 人</small></span>` : '<span class="muted">—</span>'; };
  function slotBoard() {
    return `<div class="slotgrid">${SLOTS.map(s => { const picked = s.items.filter(i => RV.get(i.id).status === 'adopt'); return `<div class="card slotc" style="--c:${TIERS[s.tier].color}"><div class="sh"><b>${CATS[s.cat].name} · ${TIERS[s.tier].name}</b><span class="${picked.length === 1 ? 'ok' : picked.length ? 'warn' : 'none'}">${picked.length === 1 ? '已选 1 把' : picked.length ? `采纳 ${picked.length} 把` : '待评审'}</span></div>
      ${s.items.map(i => `<a class="slrow" href="#${i.id}"><img src="${icon(i.id)}" alt=""><span><b>${i.name}</b>${recTag(i.id)}</span>${rvBadge(i.id) || '<span class="muted small">未评审</span>'}</a>`).join('')}</div>`; }).join('')}</div>`;
  }
  function reviewPage() {
    const c = rvCount(), n = W.length, list = W.filter(rvMatch);
    return `<div class="page">
      <p class="eyebrow">★ · 评审会用</p><h1>评审汇总</h1>
      <p class="muted small" style="margin-top:8px;max-width:780px">每个槽位 3 选 1：在单品页点「采纳 / 延后 / 摒弃」拍板，再点一次取消；打分和意见在单品页顶部填写。所有人看到的是同一份记录，自动保存。</p>
      <section class="sec" style="margin-top:18px">
        <div class="rvsum">${RVS.map(s => `<span class="rvpill" style="--c:${RV.ST[s].color}" title="${RV.ST[s].tip}"><b>${c[s]}</b>${RV.ST[s].name}</span>`).join('')}<span class="rvpill" style="--c:#A8988A"><b>${c['']}</b>未评审</span>
          <span class="rvsp"></span>
          <button type="button" class="rvtool" data-rvact="md">导出纪要</button><button type="button" class="rvtool" data-rvact="copy">复制纪要</button><button type="button" class="rvtool" data-rvact="json">导出 JSON</button><button type="button" class="rvtool" data-rvact="import">导入 JSON</button><input type="file" id="rvfile" accept=".json,application/json" hidden></div>
        <div class="rvbar" aria-label="评审进度">${RVS.map(s => `<i style="width:${c[s] / n * 100}%;background:${RV.ST[s].color}"></i>`).join('')}</div>
        <p class="rvsave small" style="margin-top:6px"></p>
      </section>
      <section class="sec" style="margin-top:16px">${secH('1', '6 个槽位', '每个槽位理想状态是“采纳 1 把”')}${slotBoard()}</section>
      <section class="sec" style="margin-top:16px">${secH('2', '逐把明细')}
        <div class="rvfilter">${FILTERS.map(([k, t]) => `<button type="button" class="${rvFilter === k ? 'on' : ''}" data-rvf="${k}">${t}</button>`).join('')}</div>
        <div class="tscroll"><table class="tbl rvtbl"><thead><tr><th>武器</th><th>槽位</th><th>品质</th><th>评审</th><th>平均分</th><th>意见</th></tr></thead><tbody>
        ${list.map(it => { const r = RV.get(it.id), last = r.notes[r.notes.length - 1]; return `<tr>
          <td>${wchip(it.id)}</td><td>${catTag(it.cat)} ${tierTag(it.tier)}</td><td>${qChip(it)}</td>
          <td><div class="rvbtns" data-rvbtns="${it.id}">${rvBtns(it.id)}</div></td><td style="font-size:12px">${avgTxt(it.id)}</td>
          <td class="rvlast">${last ? esc(last.text.length > 50 ? last.text.slice(0, 50) + '…' : last.text) : '<span class="muted">—</span>'} <a href="#${it.id}/rv">${r.notes.length > 1 ? `共 ${r.notes.length} 条` : r.notes.length ? '查看' : '去记录'}</a></td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">没有符合筛选的武器。</td></tr>'}
        </tbody></table></div>
      </section>
    </div>`;
  }

  function exportMd() {
    const c = rvCount(), d = new Date();
    const L = ['# ABGame 武器 · 评审纪要', '', `- 导出时间：${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`,
      `- 共 ${W.length} 把：采纳 ${c.adopt} · 延后 ${c.defer} · 摒弃 ${c.drop} · 未评审 ${c['']}`,
      '- 说明：采纳 = 入选该槽位，CE2.0 制作；延后 = 备用，排到 CE2.0 之后；摒弃 = 落选', '', '## 一、各槽位结果', '',
      '| 槽位 | 备选 1 | 备选 2 | 备选 3 | 入选 |', '|---|---|---|---|---|'];
    SLOTS.forEach(s => { const pk = s.items.filter(i => RV.get(i.id).status === 'adopt').map(i => i.name).join('、') || '—'; L.push(`| ${CATS[s.cat].name}${TIERS[s.tier].name} | ${s.items.map(i => `${i.name}（${rvName(RV.get(i.id).status)}）`).join(' | ')} | ${pk} |`); });
    L.push('', '## 二、结果总表', '', '| # | 武器 | 槽位 | 品质 | 评审结果 | 好玩 | 好懂 | 好做 | 评分人数 | 意见数 |', '|---|---|---|---|---|---|---|---|---|---|');
    W.forEach((it, i) => { const r = RV.get(it.id), a = RV.avgScore(it.id), f = v => v ? v.toFixed(1) : '—'; L.push(`| ${i + 1} | ${it.name} | ${CATS[it.cat].name}${TIERS[it.tier].name} | ${QN[it.q]} | ${rvName(r.status)} | ${f(a.fun)} | ${f(a.clear)} | ${f(a.cost)} | ${a.n} | ${r.notes.length} |`); });
    L.push('', '## 三、意见明细', '');
    const withNotes = W.filter(it => RV.get(it.id).notes.length);
    if (!withNotes.length) L.push('（暂无意见）');
    withNotes.forEach(it => { const r = RV.get(it.id); L.push(`### ${it.name}（${rvName(r.status)}）`, ''); r.notes.forEach(n => L.push(`- （${fmtT(n.at)}）${n.text.replace(/\n/g, ' ')}`)); L.push(''); });
    return L.join('\n');
  }
  const stamp = () => { const d = new Date(); return `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}`; };
  function download(name, text, type) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } ta.remove(); return ok;
    }
  }
  const toastEl = document.createElement('div'); toastEl.className = 'rvtoast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl);
  let toastT = 0;
  function toast(msg, bad) { toastEl.textContent = msg; toastEl.classList.toggle('bad', !!bad); toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2000); }

  function saveText() {
    const m = RV.mode(), t = RV.syncedAt(), pc = RV.pendingCount(), su = window.CLOUD_CFG && window.CLOUD_CFG.shareUrl;
    if (m === 'cloud') return `<span class="ok">☁ 已同步云端${t ? ' · ' + fmtT(t) : ''}</span>`;
    if (m === 'error') return `<span class="bad" title="${esc(RV.lastError())}">⚠ 暂时连不上云端，已暂存本机${pc ? `（${pc} 条待同步）` : ''}</span> <button type="button" class="linkbtn" data-rvact="retry">立即重试</button>${RV.lastError() ? `<br><small class="muted">原因：${esc(RV.lastError().slice(0, 80))}</small>` : ''}`;
    if (m === 'local') return `<span class="bad">本地预览 · 记录不上云</span>${su ? ` <a class="linkbtn" href="${su}" target="_blank" rel="noopener">打开在线版 →</a>` : ''}`;
    return '<span class="muted">连接云端中…</span>';
  }
  const paintSave = () => document.querySelectorAll('.rvsave').forEach(el => { el.innerHTML = saveText(); });
  function rvRefresh() {
    document.querySelectorAll('[data-rvbtns]').forEach(el => { el.innerHTML = rvBtns(el.dataset.rvbtns); });
    document.querySelectorAll('[data-rvnotes]').forEach(el => { el.innerHTML = rvNotes(el.dataset.rvnotes); });
    document.querySelectorAll('[data-rvscores]').forEach(el => { el.innerHTML = rvScores(el.dataset.rvscores); });
    document.querySelectorAll('[data-rvbadge]').forEach(el => { el.innerHTML = rvBadge(el.dataset.rvbadge); });
    if (view.dataset.cur === 'review') { const y = window.scrollY; view.innerHTML = reviewPage(); window.scrollTo(0, y); }
    nav(view.dataset.cur);
    paintSave();
  }
  RV.onChange(rvRefresh);

  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-rv]');
    if (b) { e.preventDefault(); const was = RV.get(b.dataset.id).status; RV.setStatus(b.dataset.id, b.dataset.rv); toast(was === b.dataset.rv ? `${byId[b.dataset.id].name}：已取消` : `${byId[b.dataset.id].name} → ${rvName(b.dataset.rv)}`); return; }
    const sb = e.target.closest('[data-sc]');
    if (sb) { e.preventDefault(); RV.setScore(sb.dataset.id, sb.dataset.sc, +sb.dataset.v); return; }
    const d = e.target.closest('[data-rvdel]');
    if (d) { e.preventDefault(); if (confirm('删除这条意见？')) { RV.delNote(d.dataset.id, d.dataset.rvdel); toast('已删除'); } return; }
    const f = e.target.closest('[data-rvf]');
    if (f) { e.preventDefault(); rvFilter = rvFilter === f.dataset.rvf ? 'all' : f.dataset.rvf; const y = window.scrollY; view.innerHTML = reviewPage(); window.scrollTo(0, y); paintSave(); return; }
    const a = e.target.closest('[data-rvact]');
    if (!a) return;
    e.preventDefault();
    const act = a.dataset.rvact;
    if (act === 'md') { download(`ABGame_武器_评审纪要_${stamp()}.md`, exportMd(), 'text/markdown;charset=utf-8'); toast('纪要已导出'); }
    else if (act === 'copy') { toast((await copyText(exportMd())) ? '纪要已复制，可直接粘贴到群里' : '复制失败，请用「导出纪要」'); }
    else if (act === 'import') { const inp = document.getElementById('rvfile'); if (inp) inp.click(); }
    else if (act === 'retry') { await RV.sync(); toast(RV.mode() === 'cloud' ? '已重新连上云端' : '还是连不上，稍后会自动重试', RV.mode() !== 'cloud'); }
    else if (act === 'json') { download(`ABGame_武器_评审记录_${stamp()}.json`, JSON.stringify(RV.all(), null, 2), 'application/json'); toast('JSON 已导出'); }
  });
  document.addEventListener('change', e => {
    if (e.target.id !== 'rvfile' || !e.target.files.length) return;
    const fr = new FileReader();
    fr.onload = () => { try { const n = RV.importData(JSON.parse(fr.result)); toast(n ? `已导入 ${n} 条记录${RV.mode() === 'cloud' ? '，正在写入云端' : ''}` : '没有需要导入的新记录'); } catch (err) { toast('导入失败：' + err.message, true); } e.target.value = ''; };
    fr.readAsText(e.target.files[0], 'utf-8');
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('.rvform'); if (!f) return;
    e.preventDefault();
    if (RV.addNote(f.dataset.id, f.elements.text.value)) { f.elements.text.value = ''; f.elements.text.focus(); toast('意见已记录'); } else toast('先写点内容再提交', true);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.closest('.rvform textarea')) { e.preventDefault(); e.target.form.requestSubmit(); }
  });

  /* ---------------- 路由 ---------------- */
  const PAGE_TITLE = { review: '评审汇总', all: '武器总览', alt: '备选池', rules: '通用规则', monsters: '怪物克制', numbers: '数值总表', balance: '投放与排期', todo: '待确认' };
  function route() {
    const raw = (location.hash || '#overview').slice(1);
    const [id, anchor] = raw.split('/');
    let html;
    if (id === 'rules') html = rules();
    else if (id === 'monsters') html = monsters();
    else if (id === 'numbers') html = numbers();
    else if (id === 'balance') html = balance();
    else if (id === 'all') html = overview('all');
    else if (id === 'alt') html = overview('alt');
    else if (id === 'todo') html = todo();
    else if (id === 'review') html = reviewPage();
    else if (byId[id]) html = item(byId[id]);
    else html = overview();
    const cur = byId[id] || PAGE_TITLE[id] ? id : 'overview';
    if (view.dataset.cur !== cur) {
      const tabSw = ['overview', 'all', 'alt'].includes(view.dataset.cur) && ['overview', 'all', 'alt'].includes(cur);
      view.innerHTML = html; view.dataset.cur = cur; nav(cur);
      document.title = (byId[cur] ? byId[cur].name + ' · ' : PAGE_TITLE[cur] ? PAGE_TITLE[cur] + ' · ' : '') + 'ABGame 武器策划案';
      if (!anchor) { const ot = tabSw && document.querySelector('.otabs'); window.scrollTo(0, ot ? Math.max(0, ot.getBoundingClientRect().top + window.scrollY - 70) : 0); }
      bindStage();
      paintSave();
    }
    if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
  function bindStage() {
    const st = document.getElementById('stage');
    if (!st) return;
    st.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'pause') { st.classList.toggle('paused'); b.textContent = st.classList.contains('paused') ? '播放' : '暂停'; }
      if (b.dataset.act === 'replay') { const svg = st.querySelector('svg'); const html = svg.outerHTML; svg.outerHTML = html; st.classList.remove('paused'); st.querySelector('[data-act=pause]').textContent = '暂停'; }
    });
  }
  /* ---------------- 单击放大 ---------------- */
  const lb = document.createElement('div');
  lb.className = 'zbox'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.hidden = true;
  lb.innerHTML = '<button type="button" class="zb-x" aria-label="关闭">×</button><div class="zb-in"></div><p class="zb-cap"></p>';
  document.body.appendChild(lb);
  const closeLb = () => { lb.hidden = true; lb.querySelector('.zb-in').innerHTML = ''; document.body.classList.remove('zb-open'); };
  lb.addEventListener('click', closeLb);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLb(); });
  document.addEventListener('click', e => {
    if (!lb.hidden) return;
    if (e.target.closest('a,button,.rail,.zbox,.tnav')) return;
    const hero = e.target.closest('.hero');
    const t = hero ? hero.querySelector('img') : e.target.closest('main img, main svg.sk, main .svgcard > svg, main .hudwrap > svg');
    if (!t) return;
    e.preventDefault();
    const c = t.cloneNode(true);
    c.removeAttribute('width'); c.removeAttribute('height'); c.removeAttribute('style'); c.removeAttribute('loading');
    const box = lb.querySelector('.zb-in'); box.innerHTML = ''; box.appendChild(c);
    box.classList.toggle('dark', !!t.closest('.hudwrap,.stage,[style*="1F2734"]') || t.matches('svg.sk'));
    lb.querySelector('.zb-cap').textContent = t.getAttribute('alt') || t.getAttribute('aria-label') || '';
    lb.hidden = false; document.body.classList.add('zb-open');
  });
  window.addEventListener('hashchange', () => { if (!lb.hidden) closeLb(); });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
<script>
(function () {
  const CUR = 'V0.1';
  const VERS = [['V0.3', '驱动主轴 · 手劲→机关→供能', '../V0.3/ABGame_武器策划_V0.3.html'], ['V0.2', '传统武器包装', '../V0.2/ABGame_武器策划_V0.2.html'], ['V0.1', '首版 · 玩具化包装', '#overview']];
  const el = document.getElementById('vers'); if (!el) return;
  el.innerHTML = '<div class="vh">版本</div>' + VERS.map(([v, d, h]) => '<a class="ver' + (v === CUR ? ' on' : '') + '" href="' + h + '"><b>' + v + '</b><span>' + d + '</span></a>').join('');
})();
</script>
<script>
