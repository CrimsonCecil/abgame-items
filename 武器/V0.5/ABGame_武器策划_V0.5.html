<style>
:root{--bg:#F3ECE0;--paper:#FCF8F0;--ink:#26201B;--muted:#75675A;--faint:#A39485;--line:#E4D8C5;--t1:#8A6B45;--t2:#2F7BE0;--t3:#C98A12;--acc:#E8643C;--mint:#2A9E86;
--s1:12px;--s2:14px;--s3:18px;--s4:28px;--s5:40px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--s2)/1.6 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3,p{margin:0}
h1{font-size:var(--s4);font-weight:900;line-height:1.25}
h2{font-size:var(--s3);font-weight:700;line-height:1.3;margin:36px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small,.lead{font-size:var(--s2);font-weight:400;color:var(--muted)}
h3{font-size:var(--s3);font-weight:700;line-height:1.3}
.lead{margin-top:6px}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand i{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:var(--s2)}
.brand b{font-size:var(--s3);line-height:1.2;display:block}.brand span{font-size:var(--s1);color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav .g{font-size:var(--s1);color:var(--faint);padding:12px 10px 4px;letter-spacing:.08em}
nav a{padding:7px 10px;border-radius:9px;color:var(--muted);font-size:var(--s2)}
nav a:hover{background:#EBE1D0}nav a.on{background:var(--ink);color:var(--paper);font-weight:700}
nav a.hub{color:var(--mint);font-weight:700}
.vers{margin-top:auto;padding:0 8px;font-size:var(--s1);color:var(--faint)}
.vers div{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.vers a,.vers b{border:1px solid var(--line);border-radius:7px;padding:0 7px;color:var(--muted);font-weight:500}
.vers b{background:var(--ink);color:var(--paper);border-color:var(--ink)}.vers a:hover{border-color:var(--ink)}
main{padding:34px 40px 80px;max-width:1180px;width:100%}
.page{display:none}.page.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.zoom{cursor:zoom-in}
.tag{display:inline-block;font-size:var(--s1);font-weight:700;border-radius:99px;padding:1px 9px;color:#fff;background:var(--c);white-space:nowrap}
.c1{--c:var(--t1)}.c2{--c:var(--t2)}.c3{--c:var(--t3)}
/* hero */
.hero{background:#1E2430;color:#F4EEE3;border-radius:20px;padding:30px 32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
.hero h1{font-size:var(--s5);line-height:1.2}.hero h1 em{font-style:normal;color:#FFC94A}
.hero p{color:#B9C2D0;margin-top:10px}
.hero .k{font-size:var(--s1);letter-spacing:.14em;color:#8FA0BA;margin-bottom:8px}
.morph{position:relative;aspect-ratio:2/1;border-radius:14px;background:radial-gradient(circle at 50% 60%,#33405a,#1a2030);overflow:hidden}
.morph img{position:absolute;left:50%;top:50%;height:86%;transform:translate(-50%,-50%);opacity:0;animation:mo 6s infinite}
.morph img:nth-child(2){animation-delay:2s}.morph img:nth-child(3){animation-delay:4s}
.morph span{position:absolute;left:14px;bottom:10px;font-size:var(--s1);font-weight:700;border-radius:99px;padding:1px 10px;color:#fff;opacity:0;animation:mo 6s infinite}
.morph span:nth-of-type(2){animation-delay:2s}.morph span:nth-of-type(3){animation-delay:4s}
@keyframes mo{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
/* tier cards */
.tier{border-top:5px solid var(--c);padding:14px}
.tier h3{color:var(--c)}.tier .q{font-size:var(--s1);color:var(--muted)}
.tier ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.tier li{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:var(--s2)}.tier li i{font-style:normal;color:var(--faint);font-size:var(--s1);line-height:22px}
/* matrix */
.mx{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.mx .h{font-size:var(--s1);font-weight:700;text-align:center;color:#fff;background:var(--c);border-radius:8px;padding:3px 0}
.mx .l{display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:var(--s2);line-height:1.3}.mx .l small{font-weight:400;color:var(--muted);font-size:var(--s1)}
.cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;position:relative}
.cell img{width:100%;aspect-ratio:1.5/1;object-fit:contain;display:block}
.cell b{font-size:var(--s2);font-weight:700;display:block;margin-top:2px}
.g .wimg,.cell.c3 img{filter:drop-shadow(0 0 0 transparent)}
.glow{animation:gl 1.8s ease-in-out infinite}
@keyframes gl{0%,100%{filter:drop-shadow(0 0 2px var(--gc,#ffc94a))}50%{filter:drop-shadow(0 0 12px var(--gc,#ffc94a))}}
/* anchors */
.an{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:12px;align-items:center;padding:14px 16px}
.an+.an{margin-top:12px}
.an .t b{font-size:var(--s3);display:block;line-height:1.3}.an .t span{font-size:var(--s1);color:var(--muted)}
.an .t i{font-style:normal;font-size:var(--s1);font-weight:900;color:var(--acc);letter-spacing:.1em}
.tile{border-radius:12px;background:#F1E8D8;aspect-ratio:2/1;position:relative;overflow:hidden;display:grid;place-items:center}
.tile.dk{background:#232a38}
.tile img{position:absolute;inset:0;margin:auto;height:84%;max-width:90%;object-fit:contain}
.tile u{position:absolute;left:8px;top:6px;text-decoration:none;font-size:var(--s1);font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:0 8px}
.tile s{position:absolute;right:8px;bottom:6px;text-decoration:none;font-size:var(--s1);color:var(--ink);background:#ffffffd9;border-radius:99px;padding:0 8px}
.sw{width:100%;height:100%}
.sw.a{background:repeating-linear-gradient(90deg,#C9A473 0 5px,#B8905E 5px 10px)}
.sw.b{background:linear-gradient(135deg,#4DA3FF 0 45%,#8CC6FF 45% 52%,#2F7BE0 52%)}
.sw.c{background:linear-gradient(110deg,#2b2f38 0 30%,#6d7480 42%,#2b2f38 55%,#D9A93A 55% 70%,#F8DE8A 76%,#B8861E 84%);background-size:200% 100%;animation:sh 2.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.jig{animation:jg 1.6s infinite}@keyframes jg{0%,70%,100%{transform:none}76%{transform:translateX(-6px) rotate(-4deg)}86%{transform:none}}
.vib{animation:vb .12s linear infinite}@keyframes vb{50%{transform:translate(1.5px,-1.5px)}}
.z1{height:44%!important}.z2{height:64%!important}.z3{height:92%!important}
/* stage */
.stw{position:relative;width:100%;aspect-ratio:360/170;border-radius:12px;overflow:hidden;background:linear-gradient(#27364a 0 82%,#3a2e2a 82%)}
.st{position:absolute;left:0;top:0;width:360px;height:170px;transform-origin:0 0}
.st *{position:absolute}
.st .pl{left:22px;top:84px;width:46px;height:58px}
.st .mo{top:78px;width:62px;height:64px}
.st .wp{width:84px;height:84px}
.st .wp img{left:0;top:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.st .wp img.glow{animation:gl 1.8s ease-in-out infinite}
.st .dmg{top:58px;font-size:16px;font-weight:900;color:#FFD43B;opacity:0;text-shadow:0 1px 0 #000;animation:fl var(--T) linear infinite}
.st .spk{top:92px;width:26px;height:26px;opacity:0;animation:sp var(--T) linear infinite}
.st .tap{left:12px;top:147px;width:16px;height:16px;border-radius:50%;border:2.5px solid #FFD43B;opacity:0;animation:tp var(--T) linear infinite}
.st .tapd{left:15px;top:150px;width:10px;height:10px;border-radius:50%;background:#FFD43B}
.st .lb{top:146px;font-size:12px;color:#F6EEDF;white-space:nowrap}.st .lb.l{left:34px}.st .lb.r{right:10px}.st .lb b{color:#FFD43B;position:static}
.st .bl{border-radius:50%;opacity:0}
.st .arc{width:120px;height:120px;border-radius:50%;border:10px solid transparent;border-right-color:var(--ac);border-top-color:var(--ac);opacity:0;filter:drop-shadow(0 0 6px var(--ac))}
.st .ring{top:128px;width:110px;height:22px;border-radius:50%;border:3px solid #fff;opacity:0;animation:rg var(--T) linear infinite}
.st .cone{transform-origin:0 50%;opacity:0}
@keyframes fl{0%{opacity:0;transform:translateY(0)}1%{opacity:1}13%{opacity:1;transform:translateY(-26px)}15%,100%{opacity:0;transform:translateY(-26px)}}
@keyframes sp{0%{opacity:0;transform:scale(.4)}1%{opacity:1}5%{opacity:1;transform:scale(1.3) rotate(30deg)}7%,100%{opacity:0}}
@keyframes tp{0%{opacity:0;transform:scale(.7)}1%{opacity:1}9%{opacity:0;transform:scale(2.4)}100%{opacity:0}}
@keyframes rg{0%{opacity:0;transform:scale(.2)}1%{opacity:.95}9%{opacity:0;transform:scale(1.25)}100%{opacity:0}}

.line{margin-top:28px}.line:first-of-type{margin-top:18px}
.lh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.lh b{font-size:var(--s3)}.lh span{color:var(--muted)}
.wc{padding:12px;border-top:5px solid var(--c)}
.wc .hd{display:flex;gap:10px;align-items:center;margin-bottom:10px}

.wc .hd b{font-size:var(--s3);line-height:1.2;display:block}.wc .hd p{color:var(--muted);font-size:var(--s2);line-height:1.4;margin-top:2px}

.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chips span{font-size:var(--s1);background:#F1E8D8;border-radius:8px;padding:2px 8px;color:var(--muted)}.chips span b{color:var(--ink);font-weight:700}

.inp{aspect-ratio:2/1;border-radius:12px;background:#232a38;position:relative;overflow:hidden}
.inp *{position:absolute}
.inp .btn{left:14%;top:50%;width:54px;height:54px;margin-top:-27px;border-radius:50%;background:#FFD43B}
.inp .rip{left:14%;top:50%;width:54px;height:54px;margin-top:-27px;border-radius:50%;border:3px solid #FFD43B;animation:rp 1.6s infinite}
@keyframes rp{0%{transform:scale(1);opacity:1}40%,100%{transform:scale(2);opacity:0}}
.inp .out{right:10%;top:50%;height:70%;transform:translateY(-50%)}
.inp img.sw1{animation:s1 1.6s infinite;transform-origin:20% 80%;margin-top:-10%}@keyframes s1{0%,10%{transform:translateY(-50%) rotate(-30deg)}22%{transform:translateY(-50%) rotate(40deg)}50%,100%{transform:translateY(-50%) rotate(-30deg)}}
.inp .hold{left:14%;top:50%;width:54px;height:54px;margin-top:-27px;border-radius:50%;background:conic-gradient(#fff var(--p),#ffffff33 0);animation:hd 3s linear infinite}
@property --p{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes hd{0%{--p:0deg}40%,100%{--p:360deg}}
.inp .wheel{right:12%;top:50%;width:38%;aspect-ratio:1;transform:translateY(-50%);animation:wh 3s infinite}
@keyframes wh{0%,38%{opacity:0;transform:translateY(-50%) scale(.6)}46%,92%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0}}
.inp .no{left:0;right:0;top:0;bottom:0;display:grid;place-items:center;color:#fff;font-size:var(--s3);font-weight:700}
.cap{font-size:var(--s2);margin-top:8px}.cap b{font-weight:700}.cap span{color:var(--muted)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:var(--s2)}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:var(--s1);color:var(--muted);font-weight:500;background:#F5EEDF}
tr:last-child td{border-bottom:0}td.c,th.c{text-align:center}
td img{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:6px}
.y1{color:#1F9D78;font-weight:900}.y3{color:#C98A12}.y4{color:#C9BBA8}
.bar{height:10px;border-radius:5px;background:var(--c);transform-origin:0 50%;animation:bar 1s ease both}@keyframes bar{from{transform:scaleX(0)}}
.big{font-size:var(--s5);font-weight:900;line-height:1.1;color:var(--acc)}
.todo{display:grid;gap:8px}.todo .card{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;align-items:baseline}
.todo i{font-style:normal;font-weight:900;color:var(--acc)}.todo b{font-weight:700}.todo span{color:var(--muted)}
.note{font-size:var(--s1);color:var(--faint);margin-top:10px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(20,16,12,.86);z-index:99;display:none;place-items:center;cursor:zoom-out}
#lb.on{display:grid}#lb .box{transform-origin:50% 50%}#lb img.bigimg{max-width:92vw;max-height:88vh;background:#fff;border-radius:16px;padding:16px}
#lb .x{position:absolute;right:18px;top:14px;font-size:32px;color:#fff;background:none;border:0;cursor:pointer}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.an{grid-template-columns:1fr 1fr 1fr}.an .t{grid-column:1/-1}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.rail{position:sticky;top:0;height:auto;z-index:20;background:var(--bg);padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;gap:6px;overflow-x:auto}
.brand,.vers,nav .g{display:none}nav{flex-direction:row}nav a{white-space:nowrap}main{padding:18px 14px 60px}.g2,.g3{grid-template-columns:1fr}.hero{padding:20px}.hero h1{font-size:var(--s4)}
.mx{grid-template-columns:repeat(3,minmax(0,1fr))}.mx .l{grid-column:1/-1;flex-direction:row;gap:8px;align-items:baseline;margin-top:8px}.mx .e{display:none}}
main,.page,.tw{min-width:0;max-width:100%}.shell>*{min-width:0}
.inp img.sw1{height:56%;margin-top:4%}
</style></head><body>
